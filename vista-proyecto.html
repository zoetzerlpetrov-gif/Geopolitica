<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avance del proyecto · DOMINUS</title>
  <meta name="description" content="Vista de solo lectura del avance de un proyecto, compartida por enlace.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <script>try { const t = localStorage.getItem("gp_theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="stylesheet" href="css/app.css">
  <style>
    body { display: block; height: auto; overflow: auto; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .meta { color: var(--text-2); font-size: 13px; }
    .tarjeta { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin: 12px 0; background: var(--surface); }
    h2 { border-left: 6px solid var(--accent); padding-left: 10px; text-transform: none; letter-spacing: 0; color: var(--text); font-size: 18px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .kpis div { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; background: var(--surface); } .kpis b { display: block; font-size: 26px; }
    .fases { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; } .fases li { padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; }
    .fases li.hecha { background: color-mix(in srgb, #24733b 18%, var(--surface)); border-color: #24733b; } .fases li.actual { outline: 3px solid var(--accent); font-weight: 700; }
    .barra { height: 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; } .barra i { display: block; height: 100%; background: #24733b; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; } td, th { border-bottom: 1px solid var(--line); padding: 6px; text-align: left; vertical-align: top; }
    .solo { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; }
  </style>
</head>
<body>
  <main id="vp">
    <p class="meta">Cargando…</p>
  </main>
  <script type="module" src="js/vista-proyecto.js"></script>
</body>
</html>
