services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: dominus
      POSTGRES_DB: dominus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta generar_entorno.py}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U dominus -d dominus']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment: &private-env
      DATABASE_URL: postgresql+psycopg://dominus:${POSTGRES_PASSWORD}@db:5432/dominus
      MASTER_KEY: ${MASTER_KEY:?Falta clave}
      BACKUP_KEY: ${BACKUP_KEY:?Falta clave de copias}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:8000}
      ALLOW_LOCAL_HTTP: ${ALLOW_LOCAL_HTTP:-0}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - private_files:/app/backend/private
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: [python, -m, dominus.worker]
    environment: *private-env
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
  backups:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: [python, -m, dominus.maintenance]
    environment: *private-env
    volumes:
      - private_files:/app/backend/private
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

volumes:
  database:
  private_files:
