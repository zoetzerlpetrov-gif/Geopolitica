name: Pruebas integrales por rol

# Recorre el sitio publicado con un navegador real, una vez por rol (admin, demo, recon, analyst, command): prende y
# apaga cada capa, imagen satelital y categoría en movimiento, abre las páginas del rol y anota errores de JavaScript,
# datos que no cargan, capas vacías, imágenes que no se quitan y elementos de solo administración visibles.
# El informe queda como artefacto (14 días) y en el resumen de la corrida. Falla (rojo) si hay errores de JavaScript,
# imágenes pegadas, páginas que no cargan o algo de solo admin visible para un plan de pago.
on:
  schedule:
    - cron: "37 11 * * *"   # 05:37 en Ciudad de México
    - cron: "37 23 * * *"   # 17:37 en Ciudad de México (de día en Europa y América: trenes y vuelos con tráfico)
  workflow_dispatch:
    inputs:
      roles:
        description: "Roles separados por espacio (vacío = todos)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: e2e-roles
  cancel-in-progress: false

jobs:
  roles:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Navegador (Playwright con Chromium)
        run: |
          npm install --prefix /tmp/pw --no-save --no-audit --no-fund playwright@1.48.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Recorrer el sitio publicado por rol
        env:
          BASE: https://zoetzerlpetrov-gif.github.io/Geopolitica
          PLAYWRIGHT_MODULE: /tmp/pw/node_modules/playwright
          ROLES: ${{ github.event.inputs.roles }}
        run: |
          [[ "$ROLES" =~ ^[a-z\ ]*$ ]] || { echo "Roles inválidos"; exit 1; }
          node tools/e2e/roles.mjs $ROLES
      - name: Resumen en la corrida
        if: always()
        run: cat e2e/informe.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: informe-e2e-${{ github.run_number }}
          path: e2e/
          retention-days: 14
