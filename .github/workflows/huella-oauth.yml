name: Configurar OAuth de Huella en Cloudflare

on:
  push:
    branches: [main]
    paths: ['.github/workflows/huella-oauth.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dominus-huella-oauth
  cancel-in-progress: false

jobs:
  sincronizar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      OSINT_GITHUB_CLIENT_ID: ${{ secrets.OSINT_GITHUB_CLIENT_ID || vars.OSINT_GITHUB_CLIENT_ID || secrets.OAUTH_CLIENT_ID || vars.OAUTH_CLIENT_ID }}
      OSINT_GITHUB_CLIENT_SECRET: ${{ secrets.OSINT_GITHUB_CLIENT_SECRET || secrets.OAUTH_CLIENT_SECRET }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Comprobar variables requeridas
        shell: bash
        run: |
          faltan=0
          for nombre in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID OSINT_GITHUB_CLIENT_ID OSINT_GITHUB_CLIENT_SECRET; do
            if [ -z "${!nombre}" ]; then
              echo "::error::Falta configurar $nombre en GitHub Actions."
              faltan=1
            fi
          done
          exit "$faltan"
      - name: Transferir las credenciales al Worker geopolitica
        shell: bash
        run: |
          node -e 'const { OSINT_GITHUB_CLIENT_ID, OSINT_GITHUB_CLIENT_SECRET } = process.env; process.stdout.write(JSON.stringify({ OSINT_GITHUB_CLIENT_ID, OSINT_GITHUB_CLIENT_SECRET }));' |
            npx --yes wrangler@4.158.0 secret bulk --name geopolitica --config cloudflare/huella/wrangler.toml
