name: Shorts temáticos de YouTube

# Cada día un short vertical (menos de 60 s) de un tema distinto (config/shorts.json): 3 titulares recientes en español
# del Noticiero con su medio, paleta de color del día, voz sintética Kokoro y efectos. Queda como artefacto (7 días) y,
# si existen los secretos de YouTube, se sube SIEMPRE como privado: el admin lo revisa y lo publica en YouTube Studio.
on:
  workflow_dispatch:
    inputs:
      tema:
        description: "Sección del tema (vacío = el que toca hoy). Ej.: gastronomia_viajes, espectaculos, clima"
        required: false
  schedule:
    - cron: "41 18 * * *"  # 12:41 en Ciudad de México (respaldo: el Reloj)

permissions:
  contents: read
  actions: read

concurrency:
  group: youtube-shorts
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: ¿Ya hay short de hoy? (uno por día; con tema escrito a mano siempre se genera)
        id: hoy
        env:
          GH_TOKEN: ${{ github.token }}
          TEMA: ${{ inputs.tema }}
        run: |
          if [ -n "$TEMA" ]; then echo "ya=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          desde="$(TZ=America/Mexico_City date +%F)T06:00:00Z"
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/youtube-shorts.yml/runs?branch=main&created=%3E%3D${desde}&per_page=20" \
            --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and .conclusion == \"success\")] | length" || echo 0)
          if [ "${n:-0}" -gt 0 ]; then echo "::notice::Ya hay short de hoy: no se genera otro."; echo "ya=1" >> "$GITHUB_OUTPUT"; else echo "ya=0" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.hoy.outputs.ya != '1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.hoy.outputs.ya != '1'
        with:
          python-version: "3.12"
      - name: ffmpeg, voz Kokoro y navegador
        if: steps.hoy.outputs.ya != '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core espeak-ng fonts-noto-color-emoji
          sudo apt-get install -y -qq fonts-inter || true
          pip install -q piper-tts==1.3.0 pillow==11.3.0
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu "kokoro==0.9.4" soundfile==0.13.1 || echo "Kokoro no se instaló: se usa Piper"
          npm install --prefix /tmp/pw --no-save --no-audit --no-fund playwright@1.48.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Caché del modelo de voz Kokoro
        if: steps.hoy.outputs.ya != '1'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1_0
      - name: Armar el short
        if: steps.hoy.outputs.ya != '1'
        env:
          VOZ_MOTOR: "kokoro:ef_dora"
          PLAYWRIGHT_MODULE: /tmp/pw/node_modules/playwright
          TEMA: ${{ inputs.tema }}
        run: |
          if [ -n "$TEMA" ]; then python3 tools/shorts/shorts.py salida --tema "$TEMA"; else python3 tools/shorts/shorts.py salida; fi
      - name: Guardar el short como artefacto
        if: steps.hoy.outputs.ya != '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: short-${{ github.run_number }}
          path: |
            salida/short.mp4
            salida/miniatura.png
            salida/descripcion.txt
            salida/guion.json
          retention-days: 7
      - name: Subir a YouTube como privado (solo si hay secretos)
        if: steps.hoy.outputs.ya != '1' && github.ref == 'refs/heads/main'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 tools/shorts/subir_short.py salida
