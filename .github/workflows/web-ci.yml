name: Entorno web - Expedientes y respaldos
on:
  push:
    paths: ['js/fase4*.js', 'js/web-*.js', 'js/plataforma.js', 'fase4.html', 'plataforma.html', 'fase2.html', 'analista.html', 'tools/checks_web_ui.mjs', '.github/workflows/web-ci.yml']
  pull_request:
    paths: ['js/fase4*.js', 'js/web-*.js', 'js/plataforma.js', 'fase4.html', 'plataforma.html', 'fase2.html', 'analista.html', 'tools/checks_web_ui.mjs', '.github/workflows/web-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/dominus-web-js --no-save --no-audit --no-fund jsdom@27.4.0 fake-indexeddb@6.2.4
      - run: node --test tools/checks_web_ui.mjs
