name: Entorno web - Expedientes y respaldos
on:
  push:
    paths: ['js/fase5*.js', 'fase5.html', 'transporte.html', 'js/ia*.js', 'js/colaboracion*.js', 'colaboracion.html', 'config/colaboracion.sql', 'tools/checks_colaboracion_rls.mjs', 'js/laboratorio*.js', 'laboratorio.html', 'js/fase4*.js', 'js/operaciones*.js', 'operaciones.html', 'js/web-*.js', 'js/plataforma.js', 'fase4.html', 'plataforma.html', 'fase2.html', 'analista.html', 'tools/checks_web_ui.mjs', '.github/workflows/web-ci.yml']
  pull_request:
    paths: ['js/fase5*.js', 'fase5.html', 'transporte.html', 'js/ia*.js', 'js/colaboracion*.js', 'colaboracion.html', 'config/colaboracion.sql', 'tools/checks_colaboracion_rls.mjs', 'js/laboratorio*.js', 'laboratorio.html', 'js/fase4*.js', 'js/operaciones*.js', 'operaciones.html', 'js/web-*.js', 'js/plataforma.js', 'fase4.html', 'plataforma.html', 'fase2.html', 'analista.html', 'tools/checks_web_ui.mjs', '.github/workflows/web-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/dominus-web-js --no-save --no-audit --no-fund jsdom@27.4.0 fake-indexeddb@6.2.4 @electric-sql/pglite@0.3.14
      - run: node --test tools/checks_web_ui.mjs

      - run: CLOUD_TEST_DEPS=/tmp/dominus-web-js/node_modules/ node --test tools/checks_colaboracion_rls.mjs
