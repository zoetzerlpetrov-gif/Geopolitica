name: Autoauditoría semanal

# Evalúa el proyecto contra ISO 27001, OWASP, NIST CSF, CIS, ISO 22301, 27701, 31000, LFPDPPP y más
# (config/autoauditoria.json). Publica el resultado en la rama huérfana «datos-auditoria» con su historial;
# Pages lo copia a data/autoauditoria/ (DOMINUS OPS → Autoauditoría, solo admin).
on:
  workflow_dispatch:
  schedule:
    - cron: "23 14 * * 1"  # lunes 08:23 en Ciudad de México

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: autoauditoria
  cancel-in-progress: false

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencias de las pruebas
        run: pip install -r requirements-dev.txt
      - name: Historial anterior
        run: |
          mkdir -p autoauditoria
          if git fetch --depth 1 origin datos-auditoria 2>/dev/null; then git archive FETCH_HEAD autoauditoria | tar -x; fi
      - name: Evaluar
        run: python3 tools/autoauditoria/autoauditoria.py autoauditoria
      - name: Publicar en la rama datos-auditoria
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/pub && cp -r autoauditoria /tmp/pub/ && cd /tmp/pub
          git init -q && git checkout -q -b datos-auditoria
          git config user.name "geopolitica-bot" && git config user.email "actions@users.noreply.github.com"
          git add autoauditoria && git commit -q -m "autoauditoría $(date -u +'%Y-%m-%d')"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:datos-auditoria
  publicar:
    needs: auditar
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/pages.yml
    secrets: inherit
