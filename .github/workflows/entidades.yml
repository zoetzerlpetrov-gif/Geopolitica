name: Entidades (Wikidata)

# Organizaciones y personas de rol público desde Wikidata (CC0). Semanal, a mano o al cambiar el extractor.
on:
  workflow_dispatch:
  schedule:
    - cron: "29 5 * * 1"  # horario en UTC; se vuelve a registrar en main el 2026-10-08 (GitHub no lo había activado)
  push:
    branches-ignore: [main]
    paths: ["tools/entidades/**", ".github/workflows/entidades.yml"]

permissions:
  contents: write

concurrency:
  group: entidades-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Extraer de Wikidata
        run: python3 tools/entidades/wikidata.py
      - name: Validar (esquema cerrado de personas, sin coordenadas)
        run: |
          python3 ingest/validate_entities.py
          python3 -m pytest -q tests/test_privacidad.py
      - name: Commitear data/entidades
        run: |
          git config user.name  "geopolitica-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/entidades/
          if git diff --staged --quiet; then echo "Sin cambios."; else
            git commit -m "entidades: Wikidata $(date -u +'%Y-%m-%d %H:%MZ')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
