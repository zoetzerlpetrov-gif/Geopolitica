name: Ingesta de eventos

# Cada hora en el minuto 17 (el mapa muestra la cuenta regresiva a esta hora): GDELT + RSS + ReliefWeb.
# El resultado vive en la rama huérfana "datos-eventos", que se REESCRIBE en cada corrida (un solo
# commit) para que el historial del repositorio no crezca con cada hora. Si la validación falla, no se
# publica nada y el sitio sigue mostrando la última versión buena.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"  # horario en UTC; se vuelve a registrar en main el 2026-10-08 (GitHub no lo había activado)
  push:
    branches-ignore: [main]
    paths: ["ingest/**", "config/fuentes.json", ".github/workflows/ingest.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ingesta
  cancel-in-progress: false

jobs:
  ingerir:
    runs-on: ubuntu-latest
    timeout-minutes: 35  # la IA local (resúmenes y panorama) agrega unos minutos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      - name: Recuperar la corrida anterior (eventos de 72 h e historial de 90 días)
        run: |
          mkdir -p eventos
          if git fetch --depth 1 origin datos-eventos 2>/dev/null; then
            git archive FETCH_HEAD eventos | tar -x
          fi
          ls eventos | head

      # IA local para los resúmenes propios y el panorama: modelo abierto Qwen3-4B-Instruct-2507 (Apache-2.0) con
      # llama.cpp (MIT), dentro de esta máquina. Sin llaves ni términos de terceros; ningún texto sale de GitHub.
      # Ambos archivos se verifican por su huella SHA-256 antes de usarse.
      - name: Caché del modelo abierto y de llama.cpp
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/llm
          key: llm-qwen3-4b-2507-q4km-llamacpp-b12292
      - name: Descargar y verificar el modelo y llama.cpp (solo la primera vez)
        continue-on-error: true
        run: |
          mkdir -p ~/.cache/llm && cd ~/.cache/llm
          [ -f modelo.gguf ] || curl -sSfL -o modelo.gguf "https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
          [ -f llama.tgz ] || curl -sSfL -o llama.tgz "https://github.com/ggml-org/llama.cpp/releases/download/b12292/llama-b12292-bin-ubuntu-x64.tar.gz"
          printf '%s  %s\n' 3605803b982cb64aead44f6c1b2ae36e3acdb41d8e46c8a94c6533bc4c67e597 modelo.gguf ffaf53f17a4601493e6ffb5869c9f0c7d400bb7e124fe0096eee3b65a5862568 llama.tgz | sha256sum -c -
          [ -x llama-b12292/llama-server ] || tar xzf llama.tgz
      - name: Arrancar la IA local
        id: ia
        continue-on-error: true
        run: |
          cd ~/.cache/llm
          printf '%s  %s\n' 3605803b982cb64aead44f6c1b2ae36e3acdb41d8e46c8a94c6533bc4c67e597 modelo.gguf | sha256sum -c -
          nohup ./llama-b12292/llama-server -m modelo.gguf --host 127.0.0.1 --port 8080 -c 8192 -t "$(nproc)" --jinja > ~/llama.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8080/health >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8080/health && echo "url=http://127.0.0.1:8080/v1/chat/completions" >> "$GITHUB_OUTPUT"

      - name: Ingerir, clasificar y validar
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
          IA_LOCAL_URL: ${{ steps.ia.outputs.url }}
        run: python3 ingest/run.py --salida eventos

      - name: Caché de los polígonos de estados y provincias (Natural Earth, se generan una vez)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/admin1
          key: admin1-ne10m-v1

      - name: Zonas posiblemente afectadas (estados y provincias con eventos de severidad 3+ en 48 h)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          [ -f ~/.cache/admin1/poligonos.json ] || pip install shapely==2.1.1
          if [ -f eventos/events.json ]; then python3 tools/zonas_afectadas.py --eventos eventos/events.json --salida eventos/zonas_afectadas.geojson; fi

      - name: Licitaciones abiertas (TED de la UE, grants.gov y SAM.gov si hay llave; cada 12 h)
        continue-on-error: true
        timeout-minutes: 5
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}  # opcional y gratuita (api.data.gov); sin ella se omite SAM.gov
        run: python3 tools/licitaciones.py --salida eventos/licitaciones.json

      - name: Vulnerabilidades críticas (NVD, CISA KEV y EPSS; cada 6 h)
        continue-on-error: true
        timeout-minutes: 8
        run: python3 tools/vulnerabilidades.py --salida eventos/vulnerabilidades.json

      - name: Resumen de la corrida
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import json, os
          if os.path.exists("eventos/corrida-fallida.json"):
              log = json.load(open("eventos/corrida-fallida.json"))
              print(f"### Ingesta {log['generado_utc']}: validación fallida, no se publicó\n")
              for e in log["errores_validacion"]:
                  print(f"- {e}")
              print()
          else:
              log = json.load(open("eventos/run-log.json"))
              print(f"### Ingesta {log['generado_utc']}\n")
              print(f"Eventos publicados: **{log['eventos_total']}** ({log['eventos_nuevos']} nuevos) · candidatos {log['candidatos']} · descartados {log['descartados']}\n")
          print("| Fuente | Estado | Eventos | Segundos | Error |\n|---|---|---|---|---|")
          for f in log["fuentes"]:
              print(f"| {f['nombre']} | {f['estado']} | {f['eventos']} | {f['segundos']} | {f['error'] or ''} |")
          PY

      - name: Publicar en la rama datos-eventos (reescrita, sin historial)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/pub && cp -r eventos /tmp/pub/ && cd /tmp/pub
          git init -q && git checkout -q -b datos-eventos
          git config user.name "geopolitica-bot" && git config user.email "actions@users.noreply.github.com"
          git add eventos && git commit -q -m "eventos $(date -u +'%Y-%m-%d %H:%MZ')"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:datos-eventos

  publicar:
    needs: ingerir
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/pages.yml
    secrets: inherit  # la llave de Esri (ESRI_API_KEY) se escribe al publicar
