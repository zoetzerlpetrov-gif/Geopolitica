name: Pruebas

# Corre en cada push y en cada pull request. También lo reutiliza "Publicar en GitHub Pages".
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias de prueba
        run: pip install -r requirements-dev.txt

      - name: Validar data/events.json contra el esquema
        run: python3 ingest/validate.py

      - name: Validar catálogo y registros de entidades
        run: python3 ingest/validate_entities.py

      - name: Pruebas de Python (contratos, clasificador, dimensiones, privacidad)
        run: python3 -m pytest -q

      - name: Configurar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Pruebas de JavaScript (cuenta regresiva, estilo, capas, escape de HTML)
        run: node --test "tests/js/*.test.mjs"
