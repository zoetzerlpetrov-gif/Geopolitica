name: CodeQL

# Análisis estático de seguridad (gratuito en repositorios públicos): JavaScript y Python, en cada PR a main y
# una vez por semana. Los hallazgos aparecen en GitHub → Security → Code scanning.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 9 * * 1"  # lunes 03:23 en Ciudad de México
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lenguaje: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.lenguaje }}
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.lenguaje }}"
