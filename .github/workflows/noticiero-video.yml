name: Noticiero en video

# Cada mañana arma Brújula Diaria (noticiero en video) (tools/noticiero_video): lo relevante de cada sección del Noticiero,
# elegido y redactado con palabras propias por la IA local (modelo abierto), el clima, indicadores y el Portafolio; voz sintética Kokoro (ef_dora; respaldo Piper es_MX). El video queda como
# artefacto de la corrida (7 días) y, si existen los secretos YT_CLIENT_ID, YT_CLIENT_SECRET y YT_REFRESH_TOKEN, se
# sube a YouTube siempre como privado: el noticiero en video es solo para administración.
on:
  workflow_dispatch:
    inputs:
      fecha:
        description: "Día del noticiero (AAAA-MM-DD); vacío = hoy en Ciudad de México"
        required: false
  schedule:
    - cron: "17 13 * * *"  # 07:17 en Ciudad de México

permissions:
  contents: read

concurrency:
  group: noticiero-video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: ffmpeg (los servidores de GitHub ya no lo traen instalado)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Piper (voz de respaldo) y Pillow (pantallas de respaldo)
        run: pip install piper-tts==1.3.0 pillow==11.3.0
      - name: Voz de Brújula Diaria (Kokoro-82M, Apache-2.0, voz ef_dora)
        continue-on-error: true  # si falla, se usa Piper
        run: |
          sudo apt-get install -y -qq espeak-ng
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu "kokoro==0.9.4" soundfile==0.13.1
      - name: Caché del modelo de voz Kokoro
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1_0
      - name: Navegador para las escenas animadas (Playwright con Chromium) y fuente Inter
        continue-on-error: true  # sin navegador, el video sale con pantallas fijas
        run: |
          sudo apt-get install -y -qq fonts-inter || true
          npm install --prefix /tmp/pw --no-save --no-audit --no-fund playwright@1.48.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Voz en español de México (se guarda en caché)
        id: cache-voz
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: voz
          key: piper-es_MX-claude-high-v1
      - name: Descargar la voz
        if: steps.cache-voz.outputs.cache-hit != 'true'
        run: |
          mkdir -p voz
          for f in onnx onnx.json; do
            curl -sSfL -o "voz/es_MX-claude-high.$f" "https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_MX/claude/high/es_MX-claude-high.$f"
          done
      - name: Caché del modelo abierto y de llama.cpp (el mismo de la ingesta)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/llm
          key: llm-qwen3-4b-2507-q4km-llamacpp-b12292
      - name: Descargar y verificar el modelo y llama.cpp (solo la primera vez)
        continue-on-error: true
        run: |
          mkdir -p ~/.cache/llm && cd ~/.cache/llm
          [ -f modelo.gguf ] || curl -sSfL -o modelo.gguf "https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
          [ -f llama.tgz ] || curl -sSfL -o llama.tgz "https://github.com/ggml-org/llama.cpp/releases/download/b12292/llama-b12292-bin-ubuntu-x64.tar.gz"
          printf '%s  %s\n' 3605803b982cb64aead44f6c1b2ae36e3acdb41d8e46c8a94c6533bc4c67e597 modelo.gguf ffaf53f17a4601493e6ffb5869c9f0c7d400bb7e124fe0096eee3b65a5862568 llama.tgz | sha256sum -c -
          [ -x llama-b12292/llama-server ] || tar xzf llama.tgz
      - name: Arrancar la IA local (elige y redacta lo relevante de cada sección)
        id: ia
        continue-on-error: true
        run: |
          cd ~/.cache/llm
          printf '%s  %s\n' 3605803b982cb64aead44f6c1b2ae36e3acdb41d8e46c8a94c6533bc4c67e597 modelo.gguf | sha256sum -c -
          nohup ./llama-b12292/llama-server -m modelo.gguf --host 127.0.0.1 --port 8080 -c 8192 -t "$(nproc)" --jinja > ~/llama.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8080/health >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8080/health && echo "url=http://127.0.0.1:8080/v1/chat/completions" >> "$GITHUB_OUTPUT"
      - name: Armar el video
        env:
          IA_LOCAL_URL: ${{ steps.ia.outputs.url }}
          PIPER_MODELO: voz/es_MX-claude-high.onnx
          VOZ_MOTOR: "kokoro:ef_dora"
          PLAYWRIGHT_MODULE: /tmp/pw/node_modules/playwright
          FECHA: ${{ github.event.inputs.fecha }}
        run: |
          if [[ "$FECHA" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then python3 tools/noticiero_video/render.py salida --fecha "$FECHA"
          else python3 tools/noticiero_video/render.py salida; fi
      - name: Guardar el video como artefacto
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: noticiero-${{ github.run_number }}
          path: |
            salida/noticiero.mp4
            salida/miniatura.png
            salida/descripcion.txt
            salida/guion.json
          retention-days: 7
      - name: Subir a YouTube (solo si hay secretos)
        if: github.ref == 'refs/heads/main'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 tools/noticiero_video/subir.py salida
