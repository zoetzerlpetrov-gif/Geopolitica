name: Noticiero en video

# Cada mañana arma Brújula Diaria (noticiero en video) (tools/noticiero_video): lo relevante de cada sección del Noticiero,
# elegido y redactado con palabras propias por la IA local (modelo abierto), el clima, indicadores y el Portafolio; voz sintética Kokoro (ef_dora; respaldo Piper es_MX). El video queda como
# artefacto de la corrida (7 días) y, si existen los secretos YT_CLIENT_ID, YT_CLIENT_SECRET y YT_REFRESH_TOKEN, se
# sube a YouTube siempre como privado: el noticiero en video es solo para administración.
on:
  workflow_dispatch:
    inputs:
      fecha:
        description: "Día del noticiero (AAAA-MM-DD); vacío = hoy en Ciudad de México"
        required: false
  schedule:
    - cron: "17 13 * * *"  # 07:17 en Ciudad de México

permissions:
  contents: write  # solo para guardar el guion del video en la rama datos-comentarios (respuestas a comentarios)
  actions: read    # para ver si ya hubo un video hoy

concurrency:
  group: datos-comentarios
  cancel-in-progress: false

jobs:
  # Un solo video por día. Lo lanzan dos relojes: el «Reloj» (respaldo, 07:21 CDMX) y el horario propio de GitHub, que
  # desde el 20-nov-2026 se dispara con horas de retraso (14:00-19:00 CDMX); así salían dos videos el mismo día.
  # Si ya hay una corrida exitosa desde las 00:00 de hoy en Ciudad de México, esta termina sin hacer otro.
  # Con «fecha» escrita a mano siempre se genera (para rehacer un día a propósito).
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ya: ${{ steps.hoy.outputs.ya }}
    steps:
      - name: ¿Ya hay Brújula Diaria de hoy?
        id: hoy
        env:
          GH_TOKEN: ${{ github.token }}
          FECHA: ${{ inputs.fecha }}
        run: |
          if [ -n "$FECHA" ]; then echo "Fecha indicada a mano ($FECHA): se genera."; echo "ya=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          desde="$(TZ=America/Mexico_City date +%F)T06:00:00Z"  # 00:00 en Ciudad de México (UTC-6, sin horario de verano)
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/noticiero-video.yml/runs?branch=main&created=%3E%3D${desde}&per_page=20" \
            --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and .conclusion == \"success\")] | length" || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "::notice::Ya hay un video de Brújula Diaria de hoy ($n corrida(s) exitosa(s) desde $desde): no se genera otro."
            echo "ya=1" >> "$GITHUB_OUTPUT"
          else
            echo "ya=0" >> "$GITHUB_OUTPUT"
          fi

  video:
    needs: revisar
    if: ${{ needs.revisar.outputs.ya != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: ffmpeg (los servidores de GitHub ya no lo traen instalado)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Piper (voz de respaldo) y Pillow (pantallas de respaldo)
        run: pip install piper-tts==1.3.0 pillow==11.3.0
      - name: Voz de Brújula Diaria (Kokoro-82M, Apache-2.0, voz ef_dora)
        continue-on-error: true  # si falla, se usa Piper
        run: |
          sudo apt-get install -y -qq espeak-ng
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu "kokoro==0.9.4" soundfile==0.13.1
      - name: Caché del modelo de voz Kokoro
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1_0
      - name: Navegador para las escenas animadas (Playwright con Chromium) y fuente Inter
        continue-on-error: true  # sin navegador, el video sale con pantallas fijas
        run: |
          sudo apt-get install -y -qq fonts-inter || true
          npm install --prefix /tmp/pw --no-save --no-audit --no-fund playwright@1.48.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Voz en español de México (se guarda en caché)
        id: cache-voz
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: voz
          key: piper-es_MX-claude-high-v1
      - name: Descargar la voz
        if: steps.cache-voz.outputs.cache-hit != 'true'
        run: |
          mkdir -p voz
          for f in onnx onnx.json; do
            curl -sSfL -o "voz/es_MX-claude-high.$f" "https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_MX/claude/high/es_MX-claude-high.$f"
          done
      - name: Caché del modelo abierto y de llama.cpp (el mismo de la ingesta)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/llm
          key: llm-qwen3-4b-2507-q4km-llamacpp-b12292
      - name: Descargar y verificar el modelo y llama.cpp (solo la primera vez)
        continue-on-error: true
        run: |
          mkdir -p ~/.cache/llm && cd ~/.cache/llm
          [ -f modelo.gguf ] || curl -sSfL -o modelo.gguf "https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
          [ -f llama.tgz ] || curl -sSfL -o llama.tgz "https://github.com/ggml-org/llama.cpp/releases/download/b12292/llama-b12292-bin-ubuntu-x64.tar.gz"
          printf '%s  %s\n' 3605803b982cb64aead44f6c1b2ae36e3acdb41d8e46c8a94c6533bc4c67e597 modelo.gguf ffaf53f17a4601493e6ffb5869c9f0c7d400bb7e124fe0096eee3b65a5862568 llama.tgz | sha256sum -c -
          [ -x llama-b12292/llama-server ] || tar xzf llama.tgz
      - name: Arrancar la IA local (elige y redacta lo relevante de cada sección)
        id: ia
        continue-on-error: true
        run: |
          cd ~/.cache/llm
          printf '%s  %s\n' 3605803b982cb64aead44f6c1b2ae36e3acdb41d8e46c8a94c6533bc4c67e597 modelo.gguf | sha256sum -c -
          nohup ./llama-b12292/llama-server -m modelo.gguf --host 127.0.0.1 --port 8080 -c 8192 -t "$(nproc)" --jinja > ~/llama.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8080/health >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8080/health && echo "url=http://127.0.0.1:8080/v1/chat/completions" >> "$GITHUB_OUTPUT"
      - name: Traer la vigilancia de brotes (rama datos-vivos; datos del plan Recon que no están en el sitio público)
        continue-on-error: true
        run: |
          mkdir -p /tmp/salud
          if git fetch -q --depth 1 origin datos-vivos; then
            for f in salud_oficial salud_noticias; do git show "FETCH_HEAD:vivos/$f.geojson" > "/tmp/salud/$f.geojson" || rm -f "/tmp/salud/$f.geojson"; done
          fi
          ls -l /tmp/salud
      - name: Traer los guiones de los videos anteriores (para no repetir noticias ni Mercados)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/noticiero_video/restaurar_historial.sh /tmp/previos
      - name: Armar el video
        id: render
        env:
          SALUD_DIR: /tmp/salud
          IA_LOCAL_URL: ${{ steps.ia.outputs.url }}
          PIPER_MODELO: voz/es_MX-claude-high.onnx
          VOZ_MOTOR: "kokoro:ef_dora"
          PLAYWRIGHT_MODULE: /tmp/pw/node_modules/playwright
          FECHA: ${{ github.event.inputs.fecha }}
          SITIO_DATOS: https://dominusosint.com
          BANXICO_API_KEY: ${{ secrets.BANXICO_API_KEY }}
        run: |
          if [ -n "$FECHA" ]; then python3 tools/noticiero_video/render.py salida --previos /tmp/previos/guiones --fecha "$FECHA"
          else python3 tools/noticiero_video/render.py salida --previos /tmp/previos/guiones; fi
      - name: Guardar el video como artefacto
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: noticiero-${{ steps.render.outputs.fecha }}-${{ github.run_number }}
          path: |
            salida/noticiero.mp4
            salida/miniatura.png
            salida/descripcion.txt
            salida/guion.json
          retention-days: 7
      - name: Subir a YouTube (solo si hay secretos)
        id: subir
        if: github.ref == 'refs/heads/main'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 tools/noticiero_video/subir.py salida
      - name: Guardar el guion para responder comentarios (rama datos-comentarios; guion y metadatos de las fuentes)
        if: steps.subir.outputs.video != ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIDEO: ${{ steps.subir.outputs.video }}
        run: |
          mkdir -p /tmp/pub && cd /tmp/pub
          git init -q
          git fetch --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" datos-comentarios
          git archive FETCH_HEAD | tar -x
          mkdir -p guiones comentarios
          python3 -c "import json,sys; g=json.load(open(sys.argv[1])); json.dump({'fecha': g['fecha'], 'edicion': g.get('edicion', {}), 'titulo': g['titulo'], 'escenas': [{'encabezado': e.get('encabezado',''), 'texto': e.get('texto','')} for e in g['escenas']], 'usadas': g.get('usadas', []), 'noticias': g.get('noticias', [])}, open('guiones/'+sys.argv[2]+'.json','w'), ensure_ascii=False)" "$GITHUB_WORKSPACE/salida/guion.json" "$VIDEO"
          python3 -c "import glob,json,os; fs=sorted(glob.glob('guiones/*.json'), key=lambda f: json.load(open(f)).get('fecha',''), reverse=True); [os.remove(f) for f in fs[30:]]"  # últimos 30
          rm -rf .git && git init -q && git checkout -q -b datos-comentarios
          git config user.name "geopolitica-bot" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "guion del video $VIDEO"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:datos-comentarios
