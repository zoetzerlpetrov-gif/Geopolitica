name: Reloj (respaldo del cron)

# Respaldo mientras GitHub no ejecute los horarios ("schedule") de los workflows.
# Cada corrida espera hasta el siguiente horario (minuto 17: ingesta; minutos 0, 20 y 40: datos vivos),
# lanza ese workflow con workflow_dispatch y se vuelve a lanzar a sí misma. GitHub permite que el
# GITHUB_TOKEN dispare workflow_dispatch (es la excepción a la regla de no encadenar workflows).
# No se apaga sola: el cron de GitHub en este repositorio se dispara de forma irregular (una vez a las
# 12:02 del 8 oct y luego nada). En cada horario lanza el workflow solo si no corrió ya.
# Para detenerla: Actions → «Reloj (respaldo del cron)» → cancelar la corrida en curso.
on:
  workflow_dispatch:
  # Resucitador: si la cadena se corta (p. ej. un 502 de la API al programar el siguiente tic, como el 4 nov 2026
  # a las 09:41 UTC), este horario la vuelve a encender. Si ya hay un tic en curso o en cola, no hace nada.
  schedule:
    - cron: "23 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: reloj
  cancel-in-progress: false

jobs:
  tic:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}  # gh necesita el repositorio: el job no clona el código
    steps:
      - name: Si lo lanzó el horario y la cadena sigue viva, no hacer nada
        id: vivo
        if: github.event_name == 'schedule'
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/reloj.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and (.status == \"in_progress\" or .status == \"queued\" or .status == \"waiting\" or .status == \"pending\"))] | length" || echo 1)
          if [ "$n" != "0" ]; then echo "La cadena del reloj sigue viva ($n en curso o en cola): nada que hacer"; echo "sigue=1" >> "$GITHUB_OUTPUT"; else echo "La cadena estaba cortada: se vuelve a encender"; fi

      - name: Esperar al siguiente horario y lanzar el workflow que toca (si no corrió ya)
        if: steps.vivo.outputs.sigue != '1'
        run: |
          ahora=$(date -u +%s)
          min=$(( (ahora / 60) % 60 ))
          # Próximo minuto objetivo dentro de la hora: 0, 17, 20, 40 (o 0 de la siguiente hora).
          for m in 0 17 20 40 60; do if [ "$m" -gt "$min" ]; then objetivo=$m; break; fi; done
          espera=$(( (objetivo - min) * 60 - (ahora % 60) ))
          echo "Minuto actual $min; siguiente horario en el minuto $((objetivo % 60)) (espera ${espera}s)"
          sleep "$espera"
          # El cron de GitHub a veces se dispara y a veces no: se lanza solo si el workflow no corrió
          # en los últimos minutos (por horario, por push o a mano), para no duplicar.
          case $((objetivo % 60)) in
            17) wf=ingest.yml; ventana=25 ;;
            *)  wf=vivos.yml;  ventana=12 ;;
          esac
          sleep 60  # margen para que una corrida programada aparezca en la API
          desde=$(date -u -d "-${ventana} minutes" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?branch=main&created=%3E${desde}&per_page=1" --jq '.total_count' || echo 0)
          if [ "$n" = "0" ]; then echo "Lanzando $wf"; gh workflow run "$wf" --ref main; else echo "$wf ya corrió en los últimos ${ventana} min: no se duplica"; fi
          # Revisión diaria de procesos (estado.html): a las 13 h UTC, si no ha corrido hoy desde las 12:00 UTC.
          # (Antes se miraban las últimas 20 h: una corrida manual de la tarde anterior bastaba para saltarse
          # la revisión del día siguiente, como pasó el 30 oct 2026 tras la corrida manual de las 19:14 UTC.)
          if [ "$(date -u +%H)" = "13" ]; then
            desde=$(date -u +%Y-%m-%dT12:00:00Z)
            n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/estado-procesos.yml/runs?branch=main&created=%3E${desde}&per_page=1" --jq '.total_count' || echo 1)
            if [ "$n" = "0" ]; then echo "Lanzando estado-procesos.yml"; gh workflow run estado-procesos.yml --ref main; fi
          fi

      - name: Programar el siguiente tic, con reintentos (un error pasajero de la API no debe cortar la cadena)
        if: always() && steps.vivo.outputs.sigue != '1'
        run: |
          for i in 1 2 3 4 5; do
            if gh workflow run reloj.yml --ref main; then exit 0; fi
            echo "Intento $i falló; se reintenta en $((i * 15)) s"; sleep $((i * 15))
          done
          exit 1
