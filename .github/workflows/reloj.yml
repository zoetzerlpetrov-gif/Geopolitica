name: Reloj (respaldo del cron)

# Respaldo mientras GitHub no ejecute los horarios ("schedule") de los workflows.
# Cada corrida espera hasta el siguiente horario (minuto 17: ingesta; minutos 0, 20 y 40: datos vivos),
# lanza ese workflow con workflow_dispatch y se vuelve a lanzar a sí misma. GitHub permite que el
# GITHUB_TOKEN dispare workflow_dispatch (es la excepción a la regla de no encadenar workflows).
# No se apaga sola: el cron de GitHub en este repositorio se dispara de forma irregular (una vez a las
# 12:02 del 8 oct y luego nada). En cada horario lanza el workflow solo si no corrió ya.
# Para detenerla: Actions → «Reloj (respaldo del cron)» → cancelar la corrida en curso.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: reloj
  cancel-in-progress: false

jobs:
  tic:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}  # gh necesita el repositorio: el job no clona el código
    steps:
      - name: Esperar al siguiente horario y lanzar el workflow que toca (si no corrió ya)
        run: |
          ahora=$(date -u +%s)
          min=$(( (ahora / 60) % 60 ))
          # Próximo minuto objetivo dentro de la hora: 0, 17, 20, 40 (o 0 de la siguiente hora).
          for m in 0 17 20 40 60; do if [ "$m" -gt "$min" ]; then objetivo=$m; break; fi; done
          espera=$(( (objetivo - min) * 60 - (ahora % 60) ))
          echo "Minuto actual $min; siguiente horario en el minuto $((objetivo % 60)) (espera ${espera}s)"
          sleep "$espera"
          # El cron de GitHub a veces se dispara y a veces no: se lanza solo si el workflow no corrió
          # en los últimos minutos (por horario, por push o a mano), para no duplicar.
          case $((objetivo % 60)) in
            17) wf=ingest.yml; ventana=25 ;;
            *)  wf=vivos.yml;  ventana=12 ;;
          esac
          sleep 60  # margen para que una corrida programada aparezca en la API
          desde=$(date -u -d "-${ventana} minutes" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?branch=main&created=%3E${desde}&per_page=1" --jq '.total_count' || echo 0)
          if [ "$n" = "0" ]; then echo "Lanzando $wf"; gh workflow run "$wf" --ref main; else echo "$wf ya corrió en los últimos ${ventana} min: no se duplica"; fi

      - name: Programar el siguiente tic
        if: always()
        run: gh workflow run reloj.yml --ref main
