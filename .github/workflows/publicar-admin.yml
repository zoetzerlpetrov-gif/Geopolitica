name: Publicar administración (Cloudflare Worker)
on:
  push:
    branches: [main]
    paths: ['cloudflare/**', '*.html', 'config/paginas_admin.json', 'css/lectura.css', 'js/apariencia.js', 'js/contraste.js', '.github/workflows/publicar-admin.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dominus-publicar-admin
  cancel-in-progress: false
jobs:
  pruebas:
    uses: ./.github/workflows/ci.yml
  publicar:
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Comprobar y publicar Worker existente (sin migrar bases)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          python3 tools/pages/paginas_worker.py
          npx --yes wrangler@4.158.0 deploy --dry-run --config cloudflare/huella/wrangler.toml
          npx --yes wrangler@4.158.0 deploy --config cloudflare/huella/wrangler.toml --keep-vars
