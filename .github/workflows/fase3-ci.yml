name: Fase 3 - Backend privado
on:
  push:
    paths: ['backend/**', 'tools/fase2/**', 'tools/fase23/**', 'js/fase1-logica.js', 'js/fase2-modelo.js', '.github/workflows/fase3-ci.yml', '.dockerignore']
  pull_request:
    paths: ['backend/**', 'tools/fase2/**', 'tools/fase23/**', 'js/fase1-logica.js', 'js/fase2-modelo.js', '.github/workflows/fase3-ci.yml', '.dockerignore']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest==8.4.2 pillow==13.0.0
      - run: PYTHONPATH=backend python -m pytest backend/checks_backend.py backend/checks_phase4.py backend/checks_c2pa.py backend/checks_http.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/dominus-f4-js --no-save --no-audit --no-fund jsdom@27.4.0
      - run: node --test backend/checks_phase4_ui.mjs
      - run: python -m compileall -q backend/dominus tools/fase2 tools/fase23
      - run: docker compose --env-file /dev/null -f backend/compose.yml config --quiet
        env:
          POSTGRES_PASSWORD: test-compose-only
          MASTER_KEY: test-compose-only
          BACKUP_KEY: test-compose-only
      - run: docker build -f backend/Dockerfile -t dominus-backend:ci .
      - run: docker run --rm dominus-backend:ci python -c "import c2pa; print(c2pa.sdk_version())"
      - name: Aceptación del stack privado efímero
        run: |
          python backend/generar_entorno.py
          docker compose --env-file backend/.env -f backend/compose.yml build
          docker compose --env-file backend/.env -f backend/compose.yml up -d db validator
          docker compose --env-file backend/.env -f backend/compose.yml run --rm api python -m dominus.cli init
          docker compose --env-file backend/.env -f backend/compose.yml run --rm api python -m dominus.cli provision --organization CI --username qa-ci --output /app/backend/private/ci-onboarding.json
          docker compose --env-file backend/.env -f backend/compose.yml up -d api worker backups validator
          python backend/smoke_compose.py
      - name: Retirar entorno efímero
        if: always()
        run: docker compose --env-file backend/.env -f backend/compose.yml down -v --remove-orphans
  postgis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: dominus
          POSTGRES_DB: dominus_test
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dominus -d dominus_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest==8.4.2 pillow==13.0.0
      - run: PYTHONPATH=backend python -m pytest backend/checks_backend.py backend/checks_phase4.py -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://dominus:ephemeral-ci-only@127.0.0.1:5432/dominus_test
