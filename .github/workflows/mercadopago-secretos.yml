name: Configurar Mercado Pago en el Worker

# Copia las llaves de Mercado Pago (secretos de GitHub MP_ACCESS_TOKEN y MP_WEBHOOK_SECRET) al Worker «geopolitica»
# para el alta y baja automáticas de planes (cloudflare/planes/mercadopago.js). Se corre a mano: Actions → este flujo →
# Run workflow. Las llaves nunca se imprimen ni se escriben en el repositorio.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sincronizar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
      MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Comprobar que existen los secretos
        shell: bash
        run: |
          faltan=0
          for nombre in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID MP_ACCESS_TOKEN MP_WEBHOOK_SECRET; do
            if [ -z "${!nombre}" ]; then echo "::error::Falta configurar $nombre en GitHub → Settings → Secrets and variables → Actions."; faltan=1; fi
          done
          exit "$faltan"
      - name: Transferir las llaves al Worker
        shell: bash
        run: |
          node -e 'const { MP_ACCESS_TOKEN, MP_WEBHOOK_SECRET } = process.env; process.stdout.write(JSON.stringify({ MP_ACCESS_TOKEN, MP_WEBHOOK_SECRET }));' |
            npx --yes wrangler@4.158.0 secret bulk --name geopolitica --config cloudflare/huella/wrangler.toml > /dev/null
          echo "Llaves de Mercado Pago configuradas en el Worker."
