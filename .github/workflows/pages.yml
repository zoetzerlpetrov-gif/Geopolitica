name: Publicar en GitHub Pages

# Publica el sitio SOLO si las pruebas y la validación del esquema pasan.
# Requisito único: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:   # la ingesta horaria (Fase 2) lo llamará después de actualizar data/

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruebas:
    uses: ./.github/workflows/ci.yml

  publicar:
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          # Punta de la rama (no el commit que disparó el workflow): así, cuando la ingesta
          # horaria llama a este workflow tras commitear data/, se publica el dato nuevo.
          ref: ${{ github.ref }}

      - name: Armar el sitio (solo archivos públicos)
        env:
          ESRI_API_KEY: ${{ secrets.ESRI_API_KEY }}
        run: |
          mkdir -p _site
          cp -r index.html analista.html fase2.html fase4.html operaciones.html colaboracion.html fase5.html laboratorio.html plataforma.html camaras.html taxonomia.html reporte.html noticiero.html marco.html narrativas.html corporativo.html herramientas.html ops.html inmuebles.html analitica.html matriz.html warroom.html tutorial.html planes.html estado.html soporte.html economia.html sw.js css js vendor config data schema _site/
          cp SOURCES.md _site/ 2>/dev/null || true
          touch _site/.nojekyll
          # Llave pública de Esri para la imagen satelital nítida (restringida al dominio en ArcGIS).
          # Vive en el secreto ESRI_API_KEY, nunca en el repositorio; sin secreto no se escribe el archivo.
          if [ -n "$ESRI_API_KEY" ]; then
            python3 -c 'import json,os; print(json.dumps({"esri_llave": os.environ["ESRI_API_KEY"]}))' > _site/config/satelite.json
          fi
          # Capas PMTiles: rama huérfana "datos-capas" (workflow "Construir capas").
          mkdir -p _site/data/capas
          if git fetch --depth 1 origin datos-capas 2>/dev/null; then
            git archive FETCH_HEAD capas | tar -x -C /tmp && cp /tmp/capas/manifest.json /tmp/capas/*.pmtiles /tmp/capas/*.geojson _site/data/capas/ 2>/dev/null || true
            cp /tmp/capas/*.grupos.json _site/data/capas/ 2>/dev/null || true  # grupos por zona (números a zoom bajo; js/capas.js)
            cp /tmp/capas/buscar_*.json _site/data/capas/ 2>/dev/null || true  # índices del buscador de Organizaciones
            cp /tmp/capas/volcanes_lista.json _site/data/capas/ 2>/dev/null || true  # evaluador de inmuebles (inmuebles.html)
            cp -r /tmp/capas/historia _site/data/capas/ 2>/dev/null || true  # cronología por país (bloque Historia)
          else
            echo "Aún no existe la rama datos-capas"
          fi
          # Autoauditoría semanal (DOMINUS OPS, solo admin): rama huérfana "datos-auditoria".
          mkdir -p _site/data/autoauditoria
          if git fetch --depth 1 origin datos-auditoria 2>/dev/null; then
            git archive FETCH_HEAD autoauditoria | tar -x -C /tmp && cp /tmp/autoauditoria/*.json _site/data/autoauditoria/
          else
            echo "Aún no existe la rama datos-auditoria"
          fi
          # Estado diario de los procesos (estado.html, solo admin): rama huérfana "datos-estado".
          mkdir -p _site/data/estado
          if git fetch --depth 1 origin datos-estado 2>/dev/null; then
            git archive FETCH_HEAD estado | tar -x -C /tmp && cp /tmp/estado/*.json _site/data/estado/
          else
            echo "Aún no existe la rama datos-estado"
          fi
          # Economía (economia.html, solo admin): rama huérfana "datos-economia".
          mkdir -p _site/data/economia
          if git fetch --depth 1 origin datos-economia 2>/dev/null; then
            git archive FETCH_HEAD economia | tar -x -C /tmp && cp /tmp/economia/*.json _site/data/economia/
          else
            echo "Aún no existe la rama datos-economia"
          fi
          # Datos en movimiento: viven en la rama huérfana "datos-vivos" (workflow "Datos en movimiento").
          mkdir -p _site/data/vivos
          if git fetch --depth 1 origin datos-vivos 2>/dev/null; then
            git archive FETCH_HEAD vivos | tar -x -C /tmp && cp -r /tmp/vivos/* _site/data/vivos/
          else
            echo "Aún no existe la rama datos-vivos"
          fi
          # Eventos reales: rama huérfana "datos-eventos" (workflow "Ingesta de eventos"). Reemplazan a los
          # datos de ejemplo.
          if git fetch --depth 1 origin datos-eventos 2>/dev/null; then
            git archive FETCH_HEAD eventos | tar -x -C /tmp
            cp /tmp/eventos/events.json /tmp/eventos/run-log.json /tmp/eventos/indice-paises.json _site/data/
            cp /tmp/eventos/zonas_afectadas.geojson _site/data/ 2>/dev/null || true
            cp /tmp/eventos/licitaciones.json _site/data/ 2>/dev/null || true  # Investigación → Licitaciones
            cp /tmp/eventos/vulnerabilidades.json _site/data/ 2>/dev/null || true  # Herramientas → vulnerabilidades
            # Historial de 90 días (un archivo por día): el mapa lo pide solo al elegir 30 o 90 días.
            if [ -d /tmp/eventos/historial ]; then
              mkdir -p _site/data/historial && cp /tmp/eventos/historial/*.json _site/data/historial/
              cp /tmp/eventos/historial-indice.json _site/data/ 2>/dev/null || true
              cp /tmp/eventos/historial-estadisticas.json _site/data/ 2>/dev/null || true  # tendencias (analitica.html)
            fi
            # Reportes diarios (JSON y PDF) de México y global.
            if [ -d /tmp/eventos/reportes ]; then
              mkdir -p _site/data/reportes && cp -r /tmp/eventos/reportes/* _site/data/reportes/
            fi
          else
            echo "Aún no existe la rama datos-eventos: se publican los datos de ejemplo"
          fi
          # Fases 2-3: solo estado genérico de fuentes, nunca expedientes privados.
          mkdir -p _site/data/fase23
          if git fetch --depth 1 origin datos-fase23 2>/dev/null; then
            git show FETCH_HEAD:estado.json > _site/data/fase23/estado.json
          fi
          du -sh _site

      - name: Empaquetar
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4

