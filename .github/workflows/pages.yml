name: Publicar el sitio (Cloudflare Pages)

# Publica el sitio SOLO si las pruebas y la validación del esquema pasan.
# Requisito único: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Dónde publicar: produccion (dominusosint.com), pruebas o uat (copias de vista previa)"
        type: choice
        options: [produccion, pruebas, uat]
        default: produccion
  workflow_call:   # la ingesta horaria (Fase 2) lo llamará después de actualizar data/
    inputs:
      ambiente:
        type: string
        required: false
        default: produccion

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ inputs.ambiente || 'produccion' }}
  cancel-in-progress: false

jobs:
  pruebas:
    uses: ./.github/workflows/ci.yml

  publicar:
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      respaldo_pages: ${{ steps.toca.outputs.pages }}
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Punta de la rama (no el commit que disparó el workflow): así, cuando la ingesta
          # horaria llama a este workflow tras commitear data/, se publica el dato nuevo.
          ref: ${{ github.ref }}

      - name: Armar el sitio (solo archivos públicos)
        env:
          ESRI_API_KEY: ${{ secrets.ESRI_API_KEY }}
        run: |
          mkdir -p _site
          cp -r index.html empresa.html creadores.html acceso.html clientes.html organizacion.html proyectos.html analista.html fase2.html fase4.html operaciones.html colaboracion.html fase5.html transporte.html laboratorio.html plataforma.html camaras.html taxonomia.html reporte.html noticiero.html marco.html narrativas.html corporativo.html herramientas.html ops.html inmuebles.html analitica.html matriz.html warroom.html cartera.html conducta.html identidad.html tutorial.html planes.html estado.html soporte.html economia.html privacidad.html terminos.html comentarios.html patrocinios.html marketing.html legal.html entidades.html apariencia.html portafolio.html demo.html assets _redirects _headers SECURITY.md .well-known finanzas.html cisnes.html clima-impactos.html continuidad-familiar.html cuotas.html vulnerabilidades.html agenda.html pruebas.html vulns-mundo.html revision-tecnica.html 404.html sw.js css js vendor config data schema _site/
          cp SOURCES.md _site/ 2>/dev/null || true
          touch _site/.nojekyll
          python3 tools/pages/fuentes_pagina.py _site/fuentes.html   # fuentes y licencias dentro del sitio (sin enlazar al repositorio)
          python3 tools/pages/sgsi_documentos.py _site/config/sgsi_documentos.json
          python3 tools/pages/mover_admin.py _site   # Admin en /ops/ (Cloudflare Access protege dominusosint.com/ops/*)
          # Llave pública de Esri para la imagen satelital nítida (restringida al dominio en ArcGIS).
          # Vive en el secreto ESRI_API_KEY, nunca en el repositorio; sin secreto no se escribe el archivo.
          if [ -n "$ESRI_API_KEY" ]; then
            python3 -c 'import json,os; print(json.dumps({"esri_llave": os.environ["ESRI_API_KEY"]}))' > _site/config/satelite.json
          fi
          # Capas PMTiles: rama huérfana "datos-capas" (workflow "Construir capas").
          mkdir -p _site/data/capas
          if git fetch --depth 1 origin datos-capas 2>/dev/null; then
            git archive FETCH_HEAD capas | tar -x -C /tmp && cp /tmp/capas/manifest.json /tmp/capas/*.pmtiles /tmp/capas/*.geojson _site/data/capas/ 2>/dev/null || true
            cp /tmp/capas/*.grupos.json _site/data/capas/ 2>/dev/null || true  # grupos por zona (números a zoom bajo; js/capas.js)
            cp /tmp/capas/buscar_*.json _site/data/capas/ 2>/dev/null || true  # índices del buscador de Organizaciones
            cp /tmp/capas/volcanes_lista.json _site/data/capas/ 2>/dev/null || true  # evaluador de inmuebles (inmuebles.html)
            cp -r /tmp/capas/historia _site/data/capas/ 2>/dev/null || true  # cronología por país (bloque Historia)
          else
            echo "Aún no existe la rama datos-capas"
          fi
          # Autoauditoría semanal (DOMINUS OPS, solo admin): rama huérfana "datos-auditoria".
          mkdir -p _site/data/autoauditoria
          if git fetch --depth 1 origin datos-auditoria 2>/dev/null; then
            git archive FETCH_HEAD autoauditoria | tar -x -C /tmp && cp /tmp/autoauditoria/*.json _site/data/autoauditoria/
          else
            echo "Aún no existe la rama datos-auditoria"
          fi
          # Estado diario de los procesos (estado.html, solo admin): rama huérfana "datos-estado".
          mkdir -p _site/data/estado
          if git fetch --depth 1 origin datos-estado 2>/dev/null; then
            git archive FETCH_HEAD estado | tar -x -C /tmp && cp /tmp/estado/*.json _site/data/estado/
          else
            echo "Aún no existe la rama datos-estado"
          fi
          # Estados financieros de las empresas del Portafolio (finanzas.html, solo admin): rama "datos-finanzas".
          mkdir -p _site/data/finanzas
          if git fetch --depth 1 origin datos-finanzas 2>/dev/null; then
            git archive FETCH_HEAD finanzas | tar -x -C /tmp && cp /tmp/finanzas/*.json _site/data/finanzas/
          fi
          # Portafolio (portafolio.html, solo admin): rama "datos-portafolio".
          mkdir -p _site/data/portafolio
          if git fetch --depth 1 origin datos-portafolio 2>/dev/null; then
            git archive FETCH_HEAD portafolio | tar -x -C /tmp && cp /tmp/portafolio/*.json _site/data/portafolio/
          fi
          # Cuotas de APIs y llaves (cuotas.html, solo admin): rama "datos-cuotas".
          mkdir -p _site/data/cuotas
          if git fetch --depth 1 origin datos-cuotas 2>/dev/null; then
            git show FETCH_HEAD:cuotas/estado.json > _site/data/cuotas/estado.json 2>/dev/null || true
          fi
          # Vigía de seguridad (estado.html, solo admin): rama "datos-vigia".
          mkdir -p _site/data/vigia
          if git fetch --depth 1 origin datos-vigia 2>/dev/null; then
            git show FETCH_HEAD:vigia/estado.json > _site/data/vigia/estado.json 2>/dev/null || true
          fi
          # Respuestas propuestas a comentarios de YouTube (comentarios.html, solo admin): rama "datos-comentarios".
          # Solo borradores.json (identificadores y texto propuesto); los guiones no se publican.
          mkdir -p _site/data/comentarios
          if git fetch --depth 1 origin datos-comentarios 2>/dev/null; then
            git show FETCH_HEAD:comentarios/borradores.json > /tmp/borradores.json 2>/dev/null && mv /tmp/borradores.json _site/data/comentarios/ || true
            # Métricas del canal para el tablero de marketing (marketing.html, solo admin).
            mkdir -p _site/data/marketing
            git show FETCH_HEAD:marketing/metricas.json > /tmp/metricas.json 2>/dev/null && mv /tmp/metricas.json _site/data/marketing/ || true
          fi
          # Piezas visuales de la campaña (marketing.html, solo admin): rama "datos-marketing-piezas".
          if git fetch --depth 1 origin datos-marketing-piezas 2>/dev/null; then
            mkdir -p _site/data/marketing && git archive FETCH_HEAD marketing/piezas | tar -x -C _site/data || true
          fi
          # Vulnerabilidades en apps y plataformas (vulns-mundo.html, solo admin): rama "datos-vulns-mundo".
          mkdir -p _site/data/seguridad
          if git fetch --depth 1 origin datos-vulns-mundo 2>/dev/null; then
            git show FETCH_HEAD:seguridad/vulns_mundo.json > /tmp/vulns_mundo.json 2>/dev/null && mv /tmp/vulns_mundo.json _site/data/seguridad/ || true
          fi
          # Bitácora normativa (Caja del analista → Bitácora normativa): rama "datos-normativa", con historial.
          mkdir -p _site/data/normativa
          if git fetch --depth 1 origin datos-normativa 2>/dev/null; then
            git archive FETCH_HEAD normativa | tar -x -C /tmp && cp /tmp/normativa/*.json _site/data/normativa/
          else
            echo "Aún no existe la rama datos-normativa"
          fi
          # Economía (economia.html, solo admin): rama huérfana "datos-economia".
          mkdir -p _site/data/economia
          if git fetch --depth 1 origin datos-economia 2>/dev/null; then
            git archive FETCH_HEAD economia | tar -x -C /tmp && cp /tmp/economia/*.json _site/data/economia/
          else
            echo "Aún no existe la rama datos-economia"
          fi
          # Análisis climático Admin: instantánea pública y compartida, sin expedientes ni consultas privadas.
          mkdir -p _site/data/clima-impactos
          rm -f _site/data/clima-impactos/cache.json
          if git fetch --depth 1 origin datos-clima-impactos 2>/dev/null; then
            git show FETCH_HEAD:clima-impactos/panorama.json > /tmp/clima-impactos-panorama.json
            cp /tmp/clima-impactos-panorama.json _site/data/clima-impactos/panorama.json
          fi
          # Horarios estáticos públicos: rama independiente; nunca contiene consultas privadas.
          mkdir -p _site/data/transporte
          if git fetch --depth 1 origin datos-transporte 2>/dev/null; then
            git archive FETCH_HEAD gtfs | tar -x -C /tmp
            cp /tmp/gtfs/*.zip /tmp/gtfs/manifest.json _site/data/transporte/
          fi
          # Datos en movimiento: viven en la rama huérfana "datos-vivos" (workflow "Datos en movimiento").
          mkdir -p _site/data/vivos
          if git fetch --depth 1 origin datos-vivos 2>/dev/null; then
            git archive FETCH_HEAD vivos | tar -x -C /tmp && cp -r /tmp/vivos/* _site/data/vivos/
          else
            echo "Aún no existe la rama datos-vivos"
          fi
          # SpaceX mantiene su instantánea en una rama independiente de la ingesta general.
          mkdir -p _site/data/starlink
          if git fetch --depth 1 origin datos-starlink 2>/dev/null; then
            git archive FETCH_HEAD starlink | tar -x -C /tmp
            cp /tmp/starlink/*.json* _site/data/starlink/
          fi
          # Eventos reales: rama huérfana "datos-eventos" (workflow "Ingesta de eventos"). Reemplazan a los
          # datos de ejemplo.
          if git fetch --depth 1 origin datos-eventos 2>/dev/null; then
            git archive FETCH_HEAD eventos | tar -x -C /tmp
            cp /tmp/eventos/events.json /tmp/eventos/run-log.json /tmp/eventos/indice-paises.json _site/data/
            cp /tmp/eventos/zonas_afectadas.geojson _site/data/ 2>/dev/null || true
            cp /tmp/eventos/licitaciones.json _site/data/ 2>/dev/null || true  # Investigación → Licitaciones
            cp /tmp/eventos/vulnerabilidades.json _site/data/ 2>/dev/null || true  # Herramientas → vulnerabilidades
            # Historial de 90 días (un archivo por día): el mapa lo pide solo al elegir 30 o 90 días.
            if [ -d /tmp/eventos/historial ]; then
              mkdir -p _site/data/historial && cp /tmp/eventos/historial/*.json _site/data/historial/
              cp /tmp/eventos/historial-indice.json _site/data/ 2>/dev/null || true
              cp /tmp/eventos/historial-estadisticas.json _site/data/ 2>/dev/null || true  # tendencias (analitica.html)
            fi
            # Reportes diarios (JSON y PDF) de México y global.
            if [ -d /tmp/eventos/reportes ]; then
              mkdir -p _site/data/reportes && cp -r /tmp/eventos/reportes/* _site/data/reportes/
            fi
          else
            echo "Aún no existe la rama datos-eventos: se publican los datos de ejemplo"
          fi
          # Fases 2-3: solo estado genérico de fuentes, nunca expedientes privados.
          mkdir -p _site/data/fase23
          if git fetch --depth 1 origin datos-fase23 2>/dev/null; then
            git show FETCH_HEAD:estado.json > _site/data/fase23/estado.json
          fi
          du -sh _site

      - name: Conservar la publicación vigente de estafas
        run: |
          git fetch --depth 1 origin datos-estafas
          mkdir -p /tmp/estafas-publicadas _site/data/vivos
          git archive FETCH_HEAD vivos/estafas.geojson vivos/estafas_estado.json | tar -x -C /tmp/estafas-publicadas
          cp /tmp/estafas-publicadas/vivos/estafas.geojson /tmp/estafas-publicadas/vivos/estafas_estado.json _site/data/vivos/

      # Desde el 19-11-2026 el sitio se publica solo en Cloudflare Pages (dominusosint.com); GitHub Pages se apaga.
      - name: Publicar en Cloudflare Pages
        timeout-minutes: 15
        env:
          # Token propio y de mínimo privilegio para Pages y R2 (CLOUDFLARE_PAGES_TOKEN); si no existe, el general.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROYECTO: dominus-osint
          CF_R2: dominus-grandes
          # produccion → rama main (dominusosint.com); pruebas/uat → <rama>.dominus-osint.pages.dev sin escribir en R2.
          CF_RAMA: ${{ (inputs.ambiente == 'pruebas' || inputs.ambiente == 'uat') && inputs.ambiente || 'main' }}
          RESPALDO_DIR: ${{ github.workspace }}/_respaldo
        run: bash tools/cloudflare/publicar_pages.sh _site

      # El sitio se republica muchas veces al día (datos en vivo cada 20 min): el respaldo en GitHub Pages se renueva
      # con cada cambio de código (push o manual) y cada 6 h; el archivo descargable, con cada cambio de código y a las 00 h UTC.
      - name: ¿Toca respaldo?
        id: toca
        if: ${{ inputs.ambiente != 'pruebas' && inputs.ambiente != 'uat' }}
        run: |
          h=$((10#$(date -u +%H))); m=$((10#$(date -u +%M)))
          ev="${{ github.event_name }}"
          pages=0; archivo=0
          if [ "$ev" = push ] || [ "$ev" = workflow_dispatch ]; then pages=1; archivo=1; fi
          if [ $((h % 6)) -eq 0 ] && [ "$m" -lt 25 ]; then pages=1; fi
          if [ "$h" -eq 0 ] && [ "$m" -lt 25 ]; then archivo=1; fi
          [ -f _respaldo/index.html ] || { pages=0; archivo=0; }
          echo "pages=$pages" >> "$GITHUB_OUTPUT"; echo "archivo=$archivo" >> "$GITHUB_OUTPUT"
          echo "Respaldo: GitHub Pages=$pages, archivo=$archivo"


      # Respaldo de producción (fuera de Cloudflare): la misma copia pública y limpia queda (1) como archivo descargable
      # 14 días en la corrida y (2) publicada en GitHub Pages (zoetzerlpetrov-gif.github.io/Geopolitica), por si
      # Cloudflare falla. Un error aquí nunca detiene la publicación principal.
      - name: Respaldo descargable de producción
        if: ${{ steps.toca.outputs.archivo == '1' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: respaldo-produccion-${{ github.run_number }}
          path: _respaldo
          retention-days: 14
      - name: Empaquetar el respaldo para GitHub Pages
        if: ${{ steps.toca.outputs.pages == '1' }}
        continue-on-error: true
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _respaldo

  respaldo:
    needs: publicar
    if: ${{ needs.publicar.outputs.respaldo_pages == '1' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar el respaldo en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
