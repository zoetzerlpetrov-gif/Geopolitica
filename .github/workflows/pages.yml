name: Publicar en GitHub Pages

# Publica el sitio SOLO si las pruebas y la validación del esquema pasan.
# Requisito único: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:   # la ingesta horaria (Fase 2) lo llamará después de actualizar data/

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruebas:
    uses: ./.github/workflows/ci.yml

  publicar:
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          # Punta de la rama (no el commit que disparó el workflow): así, cuando la ingesta
          # horaria llama a este workflow tras commitear data/, se publica el dato nuevo.
          ref: ${{ github.ref }}

      - name: Armar el sitio (solo archivos públicos)
        run: |
          mkdir -p _site
          cp -r index.html taxonomia.html sw.js css js vendor config data schema _site/
          cp SOURCES.md _site/ 2>/dev/null || true
          touch _site/.nojekyll
          # Capas PMTiles: rama huérfana "datos-capas" (workflow "Construir capas").
          mkdir -p _site/data/capas
          if git fetch --depth 1 origin datos-capas 2>/dev/null; then
            git archive FETCH_HEAD capas | tar -x -C /tmp && cp /tmp/capas/* _site/data/capas/
          else
            echo "Aún no existe la rama datos-capas"
          fi
          # Datos en movimiento: viven en la rama huérfana "datos-vivos" (workflow "Datos en movimiento").
          mkdir -p _site/data/vivos
          if git fetch --depth 1 origin datos-vivos 2>/dev/null; then
            git archive FETCH_HEAD vivos | tar -x -C /tmp && cp /tmp/vivos/* _site/data/vivos/
          else
            echo "Aún no existe la rama datos-vivos"
          fi
          # Eventos reales: rama huérfana "datos-eventos" (workflow "Ingesta de eventos"). Reemplazan a los
          # datos de ejemplo.
          if git fetch --depth 1 origin datos-eventos 2>/dev/null; then
            git archive FETCH_HEAD eventos | tar -x -C /tmp
            cp /tmp/eventos/events.json /tmp/eventos/run-log.json /tmp/eventos/indice-paises.json _site/data/
            # Historial de 90 días (un archivo por día): el mapa lo pide solo al elegir 30 o 90 días.
            if [ -d /tmp/eventos/historial ]; then
              mkdir -p _site/data/historial && cp /tmp/eventos/historial/*.json _site/data/historial/
              cp /tmp/eventos/historial-indice.json _site/data/ 2>/dev/null || true
            fi
          else
            echo "Aún no existe la rama datos-eventos: se publican los datos de ejemplo"
          fi
          du -sh _site

      - name: Empaquetar
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
