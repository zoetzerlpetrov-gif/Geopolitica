name: sonda
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p capas
          git fetch --depth 1 origin datos-capas && git archive FETCH_HEAD capas | tar -x
          ls capas | grep -i cable || true
          python3 tools/sonda/cables_pacifico.py
