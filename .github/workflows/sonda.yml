name: Sonda temporal
on:
  push:
    branches: [claude/pensive-ptolemy-bkwcue]
    paths: [".github/workflows/sonda.yml", "tools/sonda_tmp.py"]
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/sonda_tmp.py
        env:
          OS_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OS_SECRETO: ${{ secrets.OPENSKY_CLIENT_SECRET }}
