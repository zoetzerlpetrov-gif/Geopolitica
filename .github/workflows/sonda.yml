name: Sonda temporal
on:
  push:
    paths: [".github/workflows/sonda.yml", "tools/sonda_tmp.py"]
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: python3 tools/sonda_tmp.py
