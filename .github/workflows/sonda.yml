name: Sonda temporal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Formulario de granos 2
        run: |
          python3 - <<'PY'
          import re, sys, urllib.parse
          from datetime import date
          sys.path.insert(0, "tools/economia")
          import precios_mx as M
          b = M.con_reintentos(M.PE.bajar)
          t = b(M.SNIIM + "ConsultaGranos.aspx").decode("utf-8", "replace")
          print("FORM>", re.findall(r"<form[^>]*>", t))
          print("INPUTS>", [x for x in re.findall(r'<input[^>]*name="([^"]+)"', t)])
          print("RADIOS>", re.findall(r'<input[^>]*type="radio"[^>]*>', t)[:12])
          for m in re.finditer(r"(?:window\.open|location|Resultados|\.aspx\?)[^;]{0,300}", t):
              print("JS>", re.sub(r"\s+", " ", m.group(0))[:300])
          for extra in ({"PreciosPorId": "1"}, {"PreciosPorId": "3"}, {"Destino": "DF: Central de Abasto de Iztapalapa DF", "DestinoId": "-1", "Destino": "Todos"}):
              u = M.url_resultados("ResultadosConsultaFechaGranos.aspx", "347", date(2026, 9, 1), date(2026, 9, 30))
              q = dict(urllib.parse.parse_qsl(u.split("?", 1)[1])); q.update(extra)
              r = b(u.split("?")[0] + "?" + urllib.parse.urlencode(q)).decode("utf-8", "replace")
              print("EXTRA", extra, len(r), M.filas_sniim(r)[:3], re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", r))[1500:2300])
          PY
