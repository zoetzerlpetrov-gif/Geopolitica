name: Sonda temporal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: calor.py con climatología real del CPC (lote de 6)
        run: |
          git fetch --depth 1 origin datos-vivos && git archive FETCH_HEAD vivos/ct/forecast.geojson | tar -x
          python3 -c "
          import sys;sys.path.insert(0,'tools/clima');import calor as C;C.LOTE=6;C.main()"
          python3 -c "
          import json;b=json.load(open('vivos/clima_base.json'));print(json.dumps(b)[:700])
          d=json.load(open('vivos/calor_frio.geojson'));print(d['con_climatologia']);print([ (f['properties']['name'],f['properties']['serie'][0]) for f in d['features'] if f['properties']['climatologia']][:6])"
