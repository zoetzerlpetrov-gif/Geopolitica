name: Sonda temporal
on:
  workflow_dispatch:
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.3.0
      - run: python3 -u tools/sonda/sonda.py
