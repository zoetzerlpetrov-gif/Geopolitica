name: sonda
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Fuentes
        continue-on-error: true
        run: python3 tools/sonda/fuentes.py
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Humo (rama completa)
        continue-on-error: true
        run: mkdir -p capturas && node tools/sonda/humo.mjs . | tee capturas/humo.txt
      - name: Subir capturas
        if: always()
        run: |
          mkdir -p capturas && cd capturas && touch .k && git init -q && git checkout -q -b sonda-capturas && git add -A . && git -c user.name=sonda -c user.email=s@s commit -qm capturas
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:sonda-capturas
