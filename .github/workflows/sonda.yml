name: Sonda temporal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install xlrd==2.0.1
      - name: Prueba real del motor de Economía
        env:
          INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}
          BANXICO_API_KEY: ${{ secrets.BANXICO_API_KEY }}
        run: python3 tools/economia/pulso_economico.py /tmp/eco && python3 -c "import json;d=json.load(open('/tmp/eco/indicadores.json'));print(d['errores'])"
