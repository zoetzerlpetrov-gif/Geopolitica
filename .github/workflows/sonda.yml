name: Sonda temporal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Sonda
        env:
          INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}
          BANXICO_API_KEY: ${{ secrets.BANXICO_API_KEY }}
        run: python3 tools/sonda/economia.py
