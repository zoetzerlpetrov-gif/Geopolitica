name: Sonda temporal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ligas de la app de índices de INEGI
        run: |
          python3 - <<'PY'
          import re, urllib.request
          def get(u):
              req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0 DOMINUS-OSINT"})
              return urllib.request.urlopen(req, timeout=60).read().decode("utf-8", "replace")
          B = "https://www.inegi.org.mx/app/indicesdeprecios/"
          t = get(B + "Resources/estructuras.json")
          print(len(t))
          pares = re.findall(r'"id"\s*:\s*"(\d+)"\s*,\s*"subtitulo"\s*:\s*"([^"]*)"', t)
          for i, sub in pares:
              if len(i) <= 12 or not re.search(r", [A-Z][a-z.]+\. \(|\d\. ", sub):
                  print(i, sub)
          PY
