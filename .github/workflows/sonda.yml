name: Sonda temporal de fuentes (se borra después)
on:
  push:
    branches: [claude/pensive-ptolemy-bkwcue]
    paths: [".github/workflows/sonda.yml"]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > s.py <<'PY'
          import json, urllib.parse, urllib.request
          UA = {"User-Agent": "Geopolitica-monitor/1.0 (https://github.com/zoetzerlpetrov-gif/Geopolitica)"}
          def get(u): return json.load(urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=90))
          for t in ["criminal organization", "organized crime group", "mafia", "drug cartel", "terrorist organization", "street gang", "outlaw motorcycle club", "triad", "yakuza group", "jihadist group", "paramilitary organization"]:
              r = get("https://www.wikidata.org/w/api.php?" + urllib.parse.urlencode({"action": "wbsearchentities", "search": t, "language": "en", "format": "json", "limit": 3}))
              print(t, "→", [(x["id"], x.get("description", "")[:50]) for x in r["search"]])
          def q(sparql):
              return get("https://query.wikidata.org/sparql?" + urllib.parse.urlencode({"query": sparql, "format": "json"}))["results"]["bindings"]
          for qid in ["Q1059478", "Q17149090", "Q2001305", "Q1077857", "Q4182287", "Q1478437", "Q15284207", "Q7210356"]:
              try:
                  r = q(f'SELECT ?x ?xLabel ?n WHERE {{ ?x wdt:P31 wd:{qid}; wikibase:sitelinks ?n. FILTER(?n>=10) SERVICE wikibase:label {{ bd:serviceParam wikibase:language "en". }} }} ORDER BY DESC(?n) LIMIT 8')
                  print(qid, len(r), [x["xLabel"]["value"] for x in r])
              except Exception as e: print(qid, e)
          r = q('SELECT (COUNT(DISTINCT ?x) AS ?c) WHERE { ?x wdt:P3461 ?by. }')
          print("P3461 designated terrorist:", r)
          r = q('SELECT ?x ?xLabel ?n WHERE { ?x wdt:P3461 ?by; wikibase:sitelinks ?n. FILTER(?n>=30) SERVICE wikibase:label { bd:serviceParam wikibase:language "en". } } ORDER BY DESC(?n) LIMIT 15')
          print([x["xLabel"]["value"] for x in r])
          PY
          python3 s.py
