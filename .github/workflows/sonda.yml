name: Sonda temporal de fuentes (se borra después)
on:
  push:
    branches: [claude/pensive-ptolemy-bkwcue]
    paths: [".github/workflows/sonda.yml"]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > s.py <<'PY'
          import json, urllib.parse, urllib.request
          UA = {"User-Agent": "Geopolitica-monitor/1.0 (https://github.com/zoetzerlpetrov-gif/Geopolitica)"}
          def get(u): return json.load(urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=90))
          def q(s): return get("https://query.wikidata.org/sparql?" + urllib.parse.urlencode({"query": s, "format": "json"}))["results"]["bindings"]
          from collections import Counter
          c = Counter()
          for t in ["Sinaloa Cartel", "Jalisco New Generation Cartel", "Gulf Cartel", "'Ndrangheta", "Camorra", "Sicilian Mafia", "MS-13", "Hells Angels", "Yamaguchi-gumi", "Solntsevskaya Bratva", "Albanian mafia", "Tren de Aragua", "Primeiro Comando da Capital", "Clan del Golfo", "Bandidos Motorcycle Club", "Mocro Maffia", "Kinahan Organised Crime Group", "Sam Gor", "Al-Shabaab", "Boko Haram"]:
              r = get("https://www.wikidata.org/w/api.php?" + urllib.parse.urlencode({"action": "wbsearchentities", "search": t, "language": "en", "format": "json", "limit": 1}))
              if not r["search"]: print(t, "—"); continue
              qid = r["search"][0]["id"]
              b = q(f'SELECT ?c ?cLabel (GROUP_CONCAT(DISTINCT ?a; separator=",") AS ?areas) (SAMPLE(?pais) AS ?p) (SAMPLE(?hq) AS ?h) WHERE {{ wd:{qid} wdt:P31 ?c. OPTIONAL {{ wd:{qid} wdt:P2541 ?a }} OPTIONAL {{ wd:{qid} wdt:P17 ?pais }} OPTIONAL {{ wd:{qid} wdt:P159 ?hq }} SERVICE wikibase:label {{ bd:serviceParam wikibase:language "en". }} }} GROUP BY ?c ?cLabel')
              for x in b: c[(x["c"]["value"].rsplit("/",1)[-1], x["cLabel"]["value"])] += 1
              print(t, qid, [(x["c"]["value"].rsplit("/",1)[-1], x["cLabel"]["value"]) for x in b], "areas:", len((b[0].get("areas") or {}).get("value","").split(",")) if b and b[0].get("areas",{}).get("value") else 0, "P17:", bool(b and b[0].get("p")), "P159:", bool(b and b[0].get("h")))
          print(c.most_common(20))
          PY
          python3 s.py
