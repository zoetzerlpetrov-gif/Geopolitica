name: Sonda temporal
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -q numpy==2.3.3 pillow==11.3.0 pygrib==2.1.6 shapely==2.1.1 h3==4.1.2
      - name: Datos vivos actuales
        run: git fetch --depth 1 origin datos-vivos && git archive origin/datos-vivos vivos | tar -x && git fetch --depth 1 origin datos-capas && git archive origin/datos-capas capas/manifest.json capas/camaras.geojson | tar -x
      - name: Recolectores nuevos
        run: |
          rm -f vivos/clima/meta.json vivos/crimen.geojson
          python3 tools/crimen/sesnsp.py || true
          python3 tools/vivos/gps_interferencia.py || true
          python3 tools/espacio/eclipses.py || true
          timeout 600 python3 tools/clima/gfs.py || true
          timeout 600 python3 tools/crimen/crimen.py || true
          python3 tools/capas/zonas_grupos.py capas || true
          mkdir -p capturas && cp vivos/sesnsp_robos.json vivos/eclipses.geojson vivos/gps_interferencia.geojson vivos/desaparecidos.geojson vivos/clima/meta.json capturas/ 2>/dev/null || true
          ls vivos/clima | head -40
          mkdir -p data && rm -rf data/vivos && cp -r vivos data/vivos && mkdir -p data/capas && cp capas/* data/capas/ 2>/dev/null || true
      - run: cd tools/sonda && npm init -y >/dev/null && npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: (python3 -m http.server 8000 >/dev/null 2>&1 &) && sleep 2 && node tools/sonda/capturas.mjs
      - name: Subir capturas a una rama temporal
        run: |
          cd capturas
          git init -q && git checkout -q -b sonda-capturas
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "capturas temporales"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:sonda-capturas
