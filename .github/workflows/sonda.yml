name: sonda
on:
  push:
    branches: [claude/pensive-ptolemy-bkwcue]
    paths: [".github/workflows/sonda.yml", "tools/sonda_zoom.mjs"]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          python3 - <<'PY'
          from PIL import Image
          from PIL.TiffImagePlugin import IFDRational as R
          im = Image.new("RGB", (400, 300), (70, 130, 200))
          ex = Image.Exif(); ex[0x010f] = "Apple"; ex[0x0110] = "iPhone 15"
          g = ex.get_ifd(0x8825); g[1] = "N"; g[2] = (R(19), R(25), R(5736, 100)); g[3] = "W"; g[4] = (R(99), R(7), R(5880, 100))
          im.save("/tmp/con_gps.jpg", exif=ex)
          PY
      - run: mkdir -p /tmp/s && cd /tmp/s && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - run: |
          (python3 -m http.server 8080 >/dev/null 2>&1 &) && sleep 2 && mkdir -p sonda
          cp tools/sonda_zoom.mjs /tmp/s/ && NODE_PATH=/tmp/s/node_modules node /tmp/s/sonda_zoom.mjs
      - if: always()
        run: |
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sonda/*.png && git commit -m "sonda: capturas de zoom" && git push
