name: sonda
on:
  push:
    branches: [claude/pensive-ptolemy-bkwcue]
    paths: [".github/workflows/sonda.yml", "tools/sonda_tmp.mjs"]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: mkdir -p /tmp/s && cd /tmp/s && npm init -y >/dev/null && npm i @huggingface/transformers@3.0.2 playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - run: cp -r js config tools /tmp/s/ && cd /tmp/s && echo '{"type":"module"}' > js/package.json && node tools/sonda_tmp.mjs
      - run: cd /tmp/s && node tools/monumentos/vectores.mjs && cp config/monumentos_vec.json $GITHUB_WORKSPACE/config/
      - run: (python3 -m http.server 8080 >/dev/null 2>&1 &) && sleep 2 && cp tools/sonda_e2e.mjs /tmp/s/tools/ && cd /tmp/s && node tools/sonda_e2e.mjs
      - run: |
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/monumentos_vec.json && git commit -m "Vectores de texto de los lugares (CLIP)" && git push
