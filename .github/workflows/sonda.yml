name: Sonda temporal de fuentes (se borra después)
on:
  push:
    branches: [claude/pensive-ptolemy-bkwcue]
    paths: [".github/workflows/sonda.yml"]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for h in air-quality-api.open-meteo.com api.open-meteo.com open-meteo.com; do echo "=== $h"; curl -s -m 20 -w "\n[HTTP %{http_code}]\n" "https://$h/robots.txt" | head -40; done
