name: Sonda temporal
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd tools/sonda && npm init -y >/dev/null && npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: git fetch --depth 1 origin datos-vivos && git archive origin/datos-vivos vivos | tar -x -C data/
      - run: (python3 -m http.server 8000 >/dev/null 2>&1 &) && sleep 2 && node tools/sonda/capturas.mjs
      - name: Subir capturas a una rama temporal
        run: |
          cd capturas
          git init -q && git checkout -q -b sonda-capturas
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "capturas temporales"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:sonda-capturas
