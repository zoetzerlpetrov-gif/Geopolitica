name: Sonda temporal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: calor.py con la rejilla mensual del CPC
        run: |
          pip install -q numpy h5py
          git fetch --depth 1 origin datos-vivos && git archive FETCH_HEAD vivos/ct/forecast.geojson | tar -x
          time python3 tools/clima/calor.py
          python3 -c "
          import json;b=json.load(open('vivos/clima_base.json'));print(len(b),sum(1 for v in b.values() if v));print(b.get('19.43,-99.13'))
          d=json.load(open('vivos/calor_frio.geojson'));print(d['con_climatologia'])
          for f in d['features']:
              p=f['properties']
              if p['onda_calor'] or p['ola_frio']: print(p['name'],p['onda_calor'],p['calor_tramos'],p['ola_frio'],p['frio_tramos'],p['serie'][0])"| head -40
