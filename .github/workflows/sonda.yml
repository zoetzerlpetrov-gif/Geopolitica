name: Sonda temporal
on:
  workflow_dispatch:
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely==2.1.1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/admin1
          key: admin1-ne10m-v1
      - run: python3 tools/sonda/sonda.py
