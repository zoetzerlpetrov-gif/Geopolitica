name: Sonda temporal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ligas de la app de índices de INEGI
        run: |
          python3 - <<'PY'
          import re, urllib.request
          def get(u):
              req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0 DOMINUS-OSINT"})
              return urllib.request.urlopen(req, timeout=60).read().decode("utf-8", "replace")
          import json
          B = "https://www.inegi.org.mx/app/indicesdeprecios/"
          t = get(B + "Estructura.aspx")
          f = re.search(r'<form action="Exportacion.aspx".*?</form>', t, re.S).group(0)
          print("FORM", re.findall(r'name="([^"]+)"', f))
          j = get(B + "Resources/estructuras.json")
          print("JSON len", len(j)); print(j[:1500])
          for m in list(re.finditer(r"objeto del gasto", j))[:10]:
              print("  OBJ", j[max(0, m.start()-300):m.end()+100].replace("\n", " "))
          js = get(B + "scripts/ExportacionAjaxInteraccion.min.js?1.9.4")
          for m in list(re.finditer(r"_anioI|_formato|idEstructura|Exportacion", js))[:12]:
              print("  JS", js[max(0, m.start()-200):m.end()+200].replace("\n", " "))
          import urllib.robotparser as R
          rp = R.RobotFileParser("https://www.inegi.org.mx/robots.txt"); rp.read()
          print("robots Exportacion:", rp.can_fetch("*", B + "Exportacion.aspx"), "json:", rp.can_fetch("*", B + "Resources/estructuras.json"))
          PY
