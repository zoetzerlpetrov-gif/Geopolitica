name: sonda
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Carga
        continue-on-error: true
        run: mkdir -p capturas && node tools/sonda/carga.mjs | tee capturas/carga.txt
      - name: Subir capturas
        if: always()
        run: |
          mkdir -p capturas && cd capturas && touch .k && git init -q && git checkout -q -b sonda-capturas && git add -A . && git -c user.name=sonda -c user.email=s@s commit -qm capturas
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:sonda-capturas
