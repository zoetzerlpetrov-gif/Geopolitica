name: Sonda temporal
on:
  push:
    branches-ignore: [main]
    paths: [".github/workflows/sonda.yml", "tools/sonda_tmp.py"]
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 -u tools/sonda_tmp.py
