name: Sonda temporal de fuentes (se borra después)
on:
  push:
    branches: [claude/pensive-ptolemy-bkwcue]
    paths: [".github/workflows/sonda.yml"]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Geopolitica-monitor/1.0 (https://github.com/zoetzerlpetrov-gif/Geopolitica)"
          p() { echo "=== $1"; curl -s -m 30 -A "$UA" -w "\n[HTTP %{http_code} %{content_type} %{size_download}B]\n" "$1" | head -c ${2:-1500}; echo; }
          p https://volcanoes.usgs.gov/hans-public/api/volcano/getVolcano/getElevatedVolcanoes 2500
          p https://volcanoes.usgs.gov/hans-public/api/volcano/getMonitoredVolcanoes 1500
          p https://www.gob.mx/cenapred 1200
          p "https://www.gob.mx/cenapred/es/archivo/prensa" 1500
          curl -s -m 30 -A "$UA" "https://www.gob.mx/cenapred/es/archivo/prensa" | grep -io '[^"<>]*popocat[^"<>]*' | head -20
          curl -s -m 30 -A "$UA" "https://www.gob.mx/cenapred" | grep -io 'href="[^"]*"' | grep -i "popo\|volc\|prensa\|articulo" | head -20
          p https://www.gob.mx/cenapred/articulos/reporte-del-monitoreo-de-cenapred-al-volcan-popocatepetl 800
          p https://www.cenapred.gob.mx/ 300
          p https://www.cenapred.gob.mx/reportesVolcanGobMX/ 300
          p https://volcano.si.edu/news/WeeklyVolcanoRSS.xml 400
