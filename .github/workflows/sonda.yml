name: Sonda temporal
# Prueba de APIs antes de construir capas (se borra antes del PR).
on:
  push:
    branches-ignore: [main]
    paths: ["sonda/**", ".github/workflows/sonda.yml"]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          INEGI_DENUE_API_KEY: ${{ secrets.INEGI_DENUE_API_KEY }}
          BANXICO_API_KEY: ${{ secrets.BANXICO_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 -u sonda/sonda.py
