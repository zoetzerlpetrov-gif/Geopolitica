name: sonda
on:
  push:
    branches: [claude/pensive-ptolemy-bkwcue]
    paths: [".github/workflows/sonda.yml", "tools/sonda_tmp.py"]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements-dev.txt
      - env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 tools/sonda_tmp.py
      - if: always()
        run: |
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sonda && git commit -m "sonda: reportes de prueba" && git push
