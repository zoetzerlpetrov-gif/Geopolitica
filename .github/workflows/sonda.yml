name: Sonda temporal
on:
  workflow_dispatch:
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          BANXICO_API_KEY: ${{ secrets.BANXICO_API_KEY }}
        run: python3 tools/noticiero/sonda.py
