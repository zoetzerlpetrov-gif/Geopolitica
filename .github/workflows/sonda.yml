name: Sonda temporal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prueba real de Precios en México
        env:
          INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}
        run: python3 tools/economia/precios_mx.py /tmp/eco && python3 -c "import json;d=json.load(open('/tmp/eco/precios_mx.json'));print('ERRORES', d['errores'])"
