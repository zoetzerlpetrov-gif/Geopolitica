name: Sonda temporal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ligas de la app de índices de INEGI
        run: |
          python3 - <<'PY'
          import re, urllib.request
          def get(u):
              req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0 DOMINUS-OSINT"})
              return urllib.request.urlopen(req, timeout=60).read().decode("utf-8", "replace")
          B = "https://www.inegi.org.mx/app/indicesdeprecios/"
          lin = get(B + "Resources/estructuras.json").splitlines()
          for n, l in enumerate(lin):
              if re.search(r"objeto del gasto|Consumidor", l, re.I):
                  print(n, " || ".join(x.strip() for x in lin[max(0, n-3):n+4]))
          PY
