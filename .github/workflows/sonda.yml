name: Sonda temporal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ligas de la app de índices de INEGI
        run: |
          python3 - <<'PY'
          import re, urllib.request
          def get(u):
              req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0 DOMINUS-OSINT"})
              return urllib.request.urlopen(req, timeout=60).read().decode("utf-8", "replace")
          for u in ["https://www.inegi.org.mx/app/indicesdeprecios/",
                    "https://www.inegi.org.mx/app/indicesdeprecios/Estructura.aspx",
                    "https://www.inegi.org.mx/programas/inpc/2018/"]:
              try:
                  t = get(u)
              except Exception as e:
                  print("##", u, "ERROR", repr(e)[:150]); continue
              print("##", u, len(t))
              for h, txt in re.findall(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>', t, re.S):
                  txt = re.sub(r"<[^>]+>|\s+", " ", txt).strip()
                  if re.search(r"indicesdeprecios|Estructura|objeto|gen[eé]rico|INPC|consumidor|tabulad", h + txt, re.I):
                      print("  ", txt[:80], "->", h[:200])
          PY
