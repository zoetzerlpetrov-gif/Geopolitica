name: Construir capas (PMTiles)

# Descarga las fuentes estáticas habilitadas en config/capas.json, las convierte a PMTiles con
# tippecanoe y commitea data/capas/. Corre el día 1 de cada mes, a mano, o al cambiar el constructor.
on:
  workflow_dispatch:
    inputs:
      familias:
        description: "Familias a construir separadas por espacio (vacío = todas las habilitadas)"
        required: false
        default: ""
  schedule:
    - cron: "41 6 1 * *"
  push:
    branches-ignore: [main]
    paths: ["tools/capas/**", "config/capas.json", ".github/workflows/capas.yml"]

permissions:
  contents: write

concurrency:
  group: capas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Caché de tippecanoe
        id: cache-tip
        uses: actions/cache@v4
        with:
          path: ~/tippecanoe-bin
          key: tippecanoe-${{ runner.os }}-v1

      - name: Compilar tippecanoe (solo si no está en caché)
        if: steps.cache-tip.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          mkdir -p ~/tippecanoe-bin && cp /tmp/tippecanoe/tippecanoe /tmp/tippecanoe/tile-join ~/tippecanoe-bin/

      - name: Construir capas
        run: |
          export PATH="$HOME/tippecanoe-bin:$PATH"
          tippecanoe --version
          python3 tools/capas/construir.py ${{ github.event.inputs.familias }}
          ls -la data/capas/
          cat data/capas/manifest.json

      - name: Commitear data/capas
        run: |
          git config user.name  "geopolitica-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/capas/
          if git diff --staged --quiet; then
            echo "Sin cambios en las capas."
          else
            git commit -m "capas: reconstrucción $(date -u +'%Y-%m-%d %H:%MZ')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
