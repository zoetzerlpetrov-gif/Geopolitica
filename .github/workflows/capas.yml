name: Construir capas (PMTiles)

# Descarga las fuentes estáticas habilitadas en config/capas.json, las convierte a PMTiles con
# tippecanoe y las publica en la rama huérfana "datos-capas" (reescrita en cada corrida, sin historial),
# de donde Pages las copia a data/capas/. Corre el día 1 de cada mes, a mano, o al cambiar el constructor.
on:
  workflow_dispatch:
    inputs:
      familias:
        description: "Familias a construir separadas por espacio (vacío = todas las habilitadas)"
        required: false
        default: ""
  schedule:
    - cron: "41 6 1 * *"  # horario en UTC; se vuelve a registrar en main el 2026-10-08 (GitHub no lo había activado)
    # Lugares de culto (~2 millones, por cajas): avanza la descarga cada 4 h; cuando todas las cajas están completas y
    # tienen menos de 25 días, la corrida termina sin descargar ni publicar.
    - cron: "20 */4 * * *"
    # Familias que dependen de Overpass (OpenStreetMap): corrida propia el día 2, con todo el plazo para ellas
    # (en la corrida completa del día 1 se quedaban sin tiempo y salían incompletas).
    - cron: "47 6 2 * *"
  push:
    branches-ignore: [main]
    paths: ["tools/capas/**", "config/capas.json", ".github/workflows/capas.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: capas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Caché de tippecanoe
        id: cache-tip
        uses: actions/cache@v4
        with:
          path: ~/tippecanoe-bin
          key: tippecanoe-${{ runner.os }}-v1

      - name: Compilar tippecanoe (solo si no está en caché)
        if: steps.cache-tip.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          mkdir -p ~/tippecanoe-bin && cp /tmp/tippecanoe/tippecanoe /tmp/tippecanoe/tile-join ~/tippecanoe-bin/

      - name: Recuperar capas anteriores (si una familia falla, se conserva su versión previa)
        run: |
          mkdir -p capas
          if git fetch --depth 1 origin datos-capas 2>/dev/null; then git archive FETCH_HEAD capas | tar -x; fi
          ls -la capas

      - name: Construir capas
        env:
          PLAZO_MIN: "70"   # el job muere a los 90 min; deja 20 para tippecanoe y publicar
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}  # cámaras en vivo de YouTube (familia «camaras»)
          INEGI_DENUE_API_KEY: ${{ secrets.INEGI_DENUE_API_KEY }}  # grandes establecimientos de México (familia «denue_grandes»)
          FAMILIAS: ${{ github.event.inputs.familias || (github.event.schedule == '20 */4 * * *' && 'lugares_culto lugares_culto_catolico lugares_culto_cristiano') || (github.event.schedule == '47 6 2 * *' && 'embajadas desaladoras farmaceuticas investigacion fronteras centros_datos militar recursos actividades') || '' }}
        run: |
          export PATH="$HOME/tippecanoe-bin:$PATH"
          tippecanoe --version
          python3 -u tools/capas/construir.py $FAMILIAS
          ls -la capas/
          cat capas/manifest.json

      - name: Cronología histórica por país (Wikidata; en la corrida mensual o si se pide «historia»)
        if: github.event.schedule != '20 */4 * * *' && github.event.schedule != '47 6 2 * *' && (github.event.inputs.familias == '' || contains(github.event.inputs.familias, 'historia'))
        continue-on-error: true
        timeout-minutes: 20
        run: python3 -u tools/historia/cronologia.py capas/historia

      - name: Publicar en la rama datos-capas (reescrita, sin historial)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f capas/.sin_cambios ]; then echo "Lugares de culto completos y recientes: nada que publicar"; exit 0; fi
          mkdir /tmp/pub && cp -r capas /tmp/pub/ && cd /tmp/pub
          git init -q && git checkout -q -b datos-capas
          git config user.name "geopolitica-bot" && git config user.email "actions@users.noreply.github.com"
          git add capas && git commit -q -m "capas $(date -u +'%Y-%m-%d %H:%MZ')"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:datos-capas

  publicar:
    needs: construir
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/pages.yml
    secrets: inherit  # la llave de Esri (ESRI_API_KEY) se escribe al publicar
