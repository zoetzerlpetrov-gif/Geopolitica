name: Portafolio (actualización diaria)

# Antes vivía en el repositorio «portafolio»; ahora corre aquí y publica en la rama datos-portafolio, que el sitio copia a
# data/portafolio/ (portafolio.html, solo admin). 09:23 UTC = 03:23 en Ciudad de México.
on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portafolio-diario
  cancel-in-progress: false

jobs:
  actualizar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias del motor
        run: pip install -r tools/portafolio/requirements.txt pytest==8.4.2
      - name: Pruebas del motor
        run: python3 -m pytest -q tools/portafolio/tests
      - name: Datos anteriores (rama datos-portafolio; caché de noticias y backtest)
        run: |
          mkdir -p datos_portafolio
          if git fetch -q --depth 1 origin datos-portafolio 2>/dev/null; then git archive FETCH_HEAD portafolio | tar -x -C datos_portafolio --strip-components=1 || true; fi
      - name: Calcular indicadores, veredicto, dividendos y noticias
        working-directory: datos_portafolio
        run: python3 ../tools/portafolio/portfolio_engine.py
      - name: Validar archivos generados
        working-directory: datos_portafolio
        run: test -s portfolio_data.json && test -s daily_report.json
      - name: Publicar en la rama datos-portafolio
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/pub/portafolio && cp datos_portafolio/*.json /tmp/pub/portafolio/ && cd /tmp/pub
          git init -q && git checkout -q -b datos-portafolio
          git config user.name "geopolitica-bot" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "portafolio $(TZ='America/Mexico_City' date +%Y-%m-%d)"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:datos-portafolio
  publicar:
    needs: actualizar
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/pages.yml
    secrets: inherit
