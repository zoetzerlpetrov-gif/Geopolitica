name: Datos en movimiento

# Cada 20 min: aeronaves (OpenSky + adsb.lol) y emergencias aéreas, trenes, avisos náuticos, perturbaciones tropicales, buques (AISStream, si hay clave), satélites (TLE cada 6 h),
# lista SDN (diaria) y clima del modelo GFS (cada 6 h, tools/clima/gfs.py). El resultado vive en la rama
# huérfana "datos-vivos", que se REESCRIBE en cada corrida (un solo commit): así el historial del repo no crece con cada instantánea.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"  # horario en UTC; se vuelve a registrar en main el 2026-10-08 (GitHub no lo había activado)
  push:
    branches-ignore: [main]
    paths: ["tools/vivos/**", ".github/workflows/vivos.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vivos
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # con Clima Táctico (cada 6 h) la corrida larga dura ~12 min; GFW suma ~4 min una vez al día
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install websockets==15.0.1 numpy==2.3.3 pillow==11.3.0 pygrib==2.1.6 shapely==2.1.1

      - name: Recuperar la instantánea anterior (para TLE y sanciones)
        run: |
          mkdir -p vivos
          if git fetch --depth 1 origin datos-vivos 2>/dev/null; then
            git archive FETCH_HEAD vivos | tar -x
          fi
          ls -la vivos

      - name: Actualizar
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: python3 tools/vivos/actualizar.py

      - name: Tráfico marítimo en puertos y estrechos (conteo con la instantánea AIS, una vez por hora)
        continue-on-error: true
        timeout-minutes: 2
        run: python3 tools/maritimo/trafico.py

      - name: Global Fishing Watch (AIS apagado, encuentros, merodeo, pesca y puertos de México, radar y revisión de barcos; una vez al día)
        continue-on-error: true
        timeout-minutes: 12
        env:
          GFW_TOKEN: ${{ secrets.SAUL_PRIVATE_GLOBALFISHINGWATCH }}
        run: python3 tools/maritimo/gfw.py

      - name: Listas oficiales (SAT 69-B cada semana, FBI Wanted cada día; si falla se conservan las anteriores)
        continue-on-error: true
        timeout-minutes: 5
        run: python3 tools/investigacion/listas.py

      - name: Emergencias aéreas (squawk 7700, 7600 y 7500; adsb.lol y OpenSky, cada corrida)
        continue-on-error: true
        timeout-minutes: 3
        run: python3 tools/transporte/emergencias_aereas.py

      - name: Trenes en circulación (Finlandia, Digitraffic, cada corrida)
        continue-on-error: true
        timeout-minutes: 2
        run: python3 tools/transporte/trenes.py

      - name: Avisos náuticos de seguridad (NGA, NAVAREA; cada corrida)
        continue-on-error: true
        timeout-minutes: 2
        run: python3 tools/transporte/avisos_nauticos.py

      - name: Perturbaciones tropicales (NHC, posible formación en 2 y 7 días; cada corrida)
        continue-on-error: true
        timeout-minutes: 2
        run: python3 tools/clima/perturbaciones.py

      - name: Clima (modelo GFS de NOAA, cada 6 h; si falla se conservan los datos anteriores)
        continue-on-error: true
        timeout-minutes: 6
        run: python3 tools/clima/gfs.py

      - name: Ciclones de todo el mundo (GDACS + IBTrACS, cada 3 h; si falla se conservan los anteriores)
        continue-on-error: true
        timeout-minutes: 3
        run: python3 tools/clima/ciclones.py

      - name: Calidad del aire en ~490 ciudades (Open-Meteo, cada 3 h; si falla se conservan los anteriores)
        continue-on-error: true
        timeout-minutes: 3
        run: python3 tools/clima/aire.py

      - name: Alertas volcánicas oficiales (CENAPRED y USGS, cada 3 h; si falla se conservan las anteriores)
        continue-on-error: true
        timeout-minutes: 3
        run: python3 tools/clima/volcanes.py

      - name: Terrorismo, narcotráfico y crimen organizado (GDELT, cada hora; si falla se conservan los anteriores)
        continue-on-error: true
        timeout-minutes: 5
        run: python3 tools/crimen/crimen.py

      - name: Tsunamis (boletines oficiales de la NOAA, cada corrida; si falla se conservan los anteriores)
        continue-on-error: true
        timeout-minutes: 3
        run: python3 tools/clima/tsunamis.py

      - name: Tornados y trombas marinas del mundo (GDELT GKG, última hora; si falla se conservan los anteriores)
        continue-on-error: true
        timeout-minutes: 6
        run: python3 tools/clima/tornados.py

      - name: Noticiero DOMINUS (30 secciones; GDELT GKG ya descargado + feeds RSS; si falla se conserva el anterior)
        continue-on-error: true
        timeout-minutes: 6
        run: python3 tools/noticiero/noticiero.py

      - name: Indicadores del noticiero (Banxico cada hora, BCE y Banco de Rusia, Tesoro y BLS cada 6 h)
        continue-on-error: true
        timeout-minutes: 3
        env:
          BANXICO_API_KEY: ${{ secrets.BANXICO_API_KEY }}
        run: python3 tools/noticiero/indicadores.py

      - name: Rayos reales (GOES GLM de NOAA en AWS, últimos 20 min; si falla se conservan los anteriores)
        continue-on-error: true
        timeout-minutes: 5
        run: pip install -q h5py==3.13.0 && python3 tools/clima/rayos.py

      - name: Apagones y cortes de agua del mundo (GDELT GKG, mismos archivos que los tornados; si falla se conservan los anteriores)
        continue-on-error: true
        timeout-minutes: 4
        run: python3 tools/clima/cortes.py

      - name: Salud (OMS, CDC y ECDC una vez al día; brotes en noticias de GDELT cada corrida; si falla se conservan los anteriores)
        continue-on-error: true
        timeout-minutes: 4
        run: python3 tools/salud/salud.py

      - name: Videos de zonas de conflicto (API de datos de YouTube, cada 2 h; solo si existe el secreto YOUTUBE_API_KEY)
        continue-on-error: true
        timeout-minutes: 3
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 tools/conflictos/videos.py

      - name: Desplazamiento forzado (ACNUR, cada 30 días; si falla se conserva el anterior)
        continue-on-error: true
        timeout-minutes: 4
        run: python3 tools/humanitario/acnur.py

      - name: Creadores de contenido con más seguidores (Wikidata, cada 7 días; si falla se conserva el anterior)
        continue-on-error: true
        timeout-minutes: 5
        run: python3 tools/creadores/creadores.py

      - name: Avisos meteorológicos de Europa (MeteoAlarm, cada corrida; si falla se conservan los anteriores)
        continue-on-error: true
        timeout-minutes: 4
        run: python3 tools/clima/meteoalarm.py

      - name: Cono de pronóstico y avisos costeros de huracanes (NHC, cada corrida; si falla se conservan los anteriores)
        continue-on-error: true
        timeout-minutes: 3
        run: python3 tools/clima/nhc_conos.py

      - name: Próximos lanzamientos espaciales (The Space Devs, cada 6 h; si falla se conservan los anteriores)
        continue-on-error: true
        timeout-minutes: 2
        run: python3 tools/espacio/lanzamientos.py

      - name: Clima Táctico propio (copia del generador de WarRoomViajero, cada 6 h; si falla se conservan los anteriores)
        continue-on-error: true
        timeout-minutes: 12
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python3 tools/clima_tactico/actualizar.py

      - name: Fenómenos anómalos (TrackAlien, NUFORC y catálogo propio; cada 6 h; si falla se conservan los anteriores)
        continue-on-error: true
        timeout-minutes: 3
        run: python3 tools/anomalias/anomalias.py

      - name: Polos (hielo marino, ozono, Groenlandia, icebergs, bases y aurora; cada parte a su ritmo; si falla se conservan los anteriores)
        continue-on-error: true
        timeout-minutes: 4
        run: python3 tools/polos/polos.py

      - name: Frentes (NOAA WPC, cada hora) y eventos de Norte en el Golfo (Open-Meteo, cada 3 h); si falla se conservan los anteriores
        continue-on-error: true
        timeout-minutes: 2
        run: python3 tools/clima/frentes.py

      - name: El Niño / La Niña (NOAA CPC, diario); si falla se conserva el anterior
        continue-on-error: true
        timeout-minutes: 2
        run: python3 tools/clima/enso.py

      - name: Mar de fondo (Open-Meteo Marine, cada 3 h); si falla se conserva el anterior
        continue-on-error: true
        timeout-minutes: 3
        run: python3 tools/clima/mar_fondo.py

      - name: Cielo (asteroides cercanos y cometas cada 12 h; bólidos, Luna y eclipses diario; NASA/JPL, COBS, USNO)
        continue-on-error: true
        timeout-minutes: 5
        run: python3 tools/espacio/cielo.py

      - name: Mes en curso (llave de la caché de DB-IP)
        run: echo "MES=$(date -u +%Y-%m)" >> "$GITHUB_ENV"

      - name: Caché de la base IP→país de DB-IP (una descarga al mes)
        uses: actions/cache@v4
        with:
          path: ~/.cache/dbip
          key: dbip-${{ env.MES }}

      - name: Red y ciberseguridad por país (IODA cada corrida, abuse.ch cada hora, CISA cada 6 h; si falla se conservan los anteriores)
        continue-on-error: true
        timeout-minutes: 6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/red/red.py

      - name: Publicar en la rama datos-vivos (reescrita, sin historial)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/pub && cp -r vivos /tmp/pub/ && cd /tmp/pub
          git init -q && git checkout -q -b datos-vivos
          git config user.name "geopolitica-bot" && git config user.email "actions@users.noreply.github.com"
          git add vivos && git commit -q -m "datos vivos $(date -u +'%Y-%m-%d %H:%MZ')"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:datos-vivos

  publicar:
    needs: actualizar
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/pages.yml
    secrets: inherit  # la llave de Esri (ESRI_API_KEY) se escribe al publicar
